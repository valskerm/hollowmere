function renderRun(){
  const r=S.run,q=qdef(),h=S.hero;let body='';
  if(r.result){
    body=`<h2>${r.result.success?'Quest complete':r.result.dead?'Fallen':'Back in Hollowmere'}</h2><p class="prose">${r.result.text}</p>
    ${r.result.lines.length?`<ul class="result-list">${r.result.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`:''}
    <div class="actions">${btn('endrun',r.result.dead?'Continue':'Return to town','','btn big')}</div>`;
  }else{
    const st=curStage();
    if(st.t==='fight')body=renderCombat(st);
    else if(r.pending){
      const p=r.pending;
      if(p.final)body=`<p class="rollline">${checkText(p.res,p.spec.dc)}. ${p.passed?'Success.':'Failure.'}</p><p class="prose">${p.final.text}</p><div class="actions">${btn('cont','Continue')}</div>`;
      else{
        const opts=[];
        if(h.pools.insp)opts.push(btn('reroll','Reroll (Heroic Inspiration)','data-k="insp"','btn ghost'));
        if(h.pools.luck)opts.push(btn('reroll',`Lucky: roll again (${h.pools.luck})`,'data-k="luck"','btn ghost'));
        if(h.cls==='bard'&&h.pools.bi&&!p.biTried)opts.push(btn('reroll',`Bardic Inspiration: +d${biDie()} (${h.pools.bi})`,'data-k="bi"','btn ghost'));
        if(h.cls==='fighter'&&h.level>=2&&h.pools.secondwind&&p.spec.skill&&!p.tacticalTried)opts.push(btn('reroll','Tactical Mind: +1d10','data-k="tactical"','btn ghost'));
        body=`<p class="rollline">${checkText(p.res,p.spec.dc)}. Failure.</p><p class="meta">You can try to change the result, or accept it.</p><div class="actions">${opts.join('')}${btn('accept','Accept the result')}</div>`;
      }
    }else if(r.resting){
      body=`<h2>Short rest</h2><p class="prose">You find a sheltered spot and take an hour to bind wounds and catch your breath.</p>
      ${r.restNote?`<p class="rollline">${r.restNote}</p>`:''}
      <p>${h.hp}/${h.hpMax} HP. Hit Dice: ${h.pools.hd} left (d${CLASSES[h.cls].hd} ${sgn(am('con'))} each).</p>
      <div class="actions">${btn('hitdie','Spend a Hit Die',disab(!h.pools.hd||h.hp>=h.hpMax),'btn ghost')}${btn('endrest','Finish resting')}</div>`;
    }else{
      const rl=(qdef().rests||1)-(r.restsUsed||0),rest=!r.rested&&rl>0?btn('shortrest',`Short rest (1 hour)${(qdef().rests||1)>1?`, ${rl} left`:''}`,'','btn ghost'):'';
      const pot=S.inv.potion&&h.hp<h.hpMax?btn('potion',`Drink a potion (${S.inv.potion})`,'','btn ghost'):'';
      const heals=h.hp<h.hpMax?['healingword','curewounds'].filter(id=>knownSpells().includes(id)&&slotFor(1)).map(id=>btn('heal',`Cast ${SPELLS[id].name}`,`data-k="${id}"`,'btn ghost')).join(''):'';
      const loh=h.cls==='paladin'&&h.pools.loh&&(h.hp<h.hpMax||h.conds.poisoned)?btn('lohq',`Lay on Hands (${h.pools.loh})`,'','btn ghost'):'';
      const wl=(loh)+(h.cls==='warlock'?(h.pools.cunning&&h.pools.pact<PACT[h.level][0]?btn('cunning','Magical Cunning (regain pact slots)','','btn ghost'):'')+(h.level>=5&&h.temp<12?btn('vigorq','Fiendish Vigor','','btn ghost'):''):'');
      const extras=rest+pot+heals+wl+(S.inv.heroism&&!h.conds.heroism?btn('drinkhero','Drink Potion of Heroism','','btn ghost'):'')+(S.inv.superior&&h.hp<h.hpMax?btn('drinksup','Drink superior healing','','btn ghost'):'');
      if(st.t==='text')body=`<p class="prose">${st.text}</p><div class="actions">${btn('cont','Continue')}${extras}</div>`;
      else if(st.t==='check')body=`<p class="prose">${st.text}</p><div class="actions">${btn('check',`Roll ${SKILL[st.skill]} (DC ${st.dc}, ${sgn(skillMod(st.skill))})`)}${extras}</div>`;
      else if(st.t==='save')body=`<p class="prose">${st.text}</p><div class="actions">${btn('check',`Roll a ${ABIL_NAME[st.save]} save (DC ${st.dc}, ${sgn(saveMod(st.save))})`)}${extras}</div>`;
      else if(st.t==='choice')body=`<p class="prose">${st.text}</p><div class="actions">${st.options.map((o,i)=>o.if&&!COND[o.if]()?'':btn('choose',o.check?`${o.label}: ${SKILL[o.check.skill]} DC ${o.check.dc} (${sgn(skillMod(o.check.skill))})`:o.label,`data-i="${i}"`,i?'btn ghost':'btn')).join('')}</div>`;
    }
  }
  return `<div class="adv" role="dialog" aria-modal="true" aria-label="${q.name}"><div class="adv-inner">
    <p class="meta">${r.qid==='patrol'?'Patrol':'Quest'}</p><h1>${q.name}</h1>
    <div class="herobar"><span class="who">${avatarHTML(h.avatar,h.name,'avatar small')}${esc(h.name)}</span><div class="bar hp"><i style="width:${pct(h.hp,h.hpMax)}%"></i></div><span>${h.hp}/${h.hpMax} HP${h.temp?` +${h.temp}`:''}, AC ${S.run.combat?heroAC():baseAC()}</span></div>
    ${Object.keys(h.conds).length||h.conc?`<p class="meta">${[...Object.keys(h.conds).map(x=>x[0].toUpperCase()+x.slice(1)),h.conc&&`Concentrating on ${SPELLS[h.conc].name}`].filter(Boolean).join('. ')}.</p>`:''}
    <div style="margin-top:14px">${body}</div></div></div>`;
}

function condTags(f){const t=[];if(f.prone)t.push('prone');if(f.turned)t.push('turned');if(f.sapped)t.push('sapped');if(f.vexed)t.push('vexed');if(f.slowed)t.push('slowed');if(f.guided)t.push('guided');if(f.noReact)t.push('no reactions');return t}
function renderCombat(st){
  const c=S.run.combat,h=S.hero,C=CLASSES[h.cls],t=curTarget(),myTurn=!c.over&&c.turn==='hero'&&!h.dying;
  const reachMap=myTurn&&!c.aim&&c.move>0?heroReach():new Map(),aim=myTurn&&c.aim?aimCells():null;
  const sp=c.aim?SPELLS[c.aim]:null;
  let cells='';
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const rock=isRock(c,x,y),f=foeAt(c,x,y),me=c.hero.x===x&&c.hero.y===y,r=reachMap.get(ck(x,y)),canGo=r&&r.d>0&&r.stop,canAim=aim&&aim.has(ck(x,y));
    let inner='',label=`Square ${x+1}, ${y+1}`;
    const gone=!f&&c.foes.find((g,gi)=>g.hp<=0&&DIED.has(gi)&&g.x===x&&g.y===y);
    let tokId='';
    if(me){inner=avatarHTML(h.avatar,h.name,`tok hero ${c.heroProne?'prone':''}`);label+=', you';tokId='hero'}
    else if(f){inner=`<span class="tok enemy ${f===t&&!c.over?'target':''} ${f.prone?'prone':''} ${f.turned?'turned':''} ${c.acting===c.foes.indexOf(f)?'acting':''}" style="--hp:${pct(f.hp,f.hpMax)}%"><b>${f.label}</b></span>`;label+=`, ${f.name}, ${f.hp} HP`;tokId='f'+c.foes.indexOf(f)}
    else if(gone){inner=`<span class="tok enemy dying" style="--hp:0%"><b>${gone.label}</b></span>`;tokId='f'+c.foes.indexOf(gone)}
    if(!inner&&c.guardian&&c.guardian.x===x&&c.guardian.y===y)inner='<span class="guardian" aria-hidden="true"></span>';
    if(rock){inner='<span class="rockshape"></span>';label+=', rock'}
    let act='';
    if(canAim)act=`data-a="cell" data-x="${x}" data-y="${y}"`;
    else if(f)act=`data-a="target" data-i="${c.foes.indexOf(f)}"`;
    else if(canGo)act=`data-a="cell" data-x="${x}" data-y="${y}"`;
    cells+=`<button class="cell ${rock?'rock':''} ${canGo?'reach':''} ${canAim?'aim':''}" ${tokId?`data-tok="${tokId}" data-cx="${x}" data-cy="${y}"`:''} ${act} ${act?'':'tabindex="-1"'} aria-label="${label}${canGo?`, move ${ft(r.d)} ft`:''}">${inner}</button>`;
  }
  const order=`<div class="initrow" aria-label="Turn order">${c.order.map((o,i)=>{const isH=o.id==='hero',f=isH?null:c.foes[o.id];
    return `<span class="chip ${!c.over&&(c.acting!=null?o.id===c.acting:(i===c.ti&&(c.turn==='hero'||o.id!=='hero')))?'now':''} ${f&&f.hp<=0?'gone':''} ${isH?'me':''}">${isH?'You':f.label} ${o.init}</span>`}).join('')}</div>`;
  let controls='';
  if(c.over)controls=`<div class="actions">${btn('cont','Continue','','btn big')}</div>`;
  else if(c.turn!=='hero'){const a=c.acting!=null?c.foes[c.acting]:null;controls=`<p class="turnline waiting"><b>${a?`${a.label} ${a.name} is acting…`:'Enemies are acting…'}</b></p>`}
  else if(h.dying)controls=`<div class="dying"><p><b>You’re dying.</b> Death saves: ${'✓'.repeat(h.dying.s)}${'·'.repeat(3-h.dying.s)} successes, ${'✗'.repeat(Math.min(3,h.dying.f))}${'·'.repeat(3-Math.min(3,h.dying.f))} failures. Roll 10 or higher to succeed; a natural 20 brings you back with 1 HP.</p>${btn('act','Roll death save','data-k="deathsave"','btn big')}</div>`;
  else if(c.aim)controls=`<p class="turnline"><b>${sp.name}:</b> tap a lit square${sp.form==='point'?`. Everything within ${ft(sp.radius)} ft of it is caught`:sp.form==='cone'?' to aim the cone that way':' to teleport there'}.</p><div class="actions">${btn('act','Cancel','data-k="cancelaim"','btn ghost')}</div>`;
  else{
    const tDist=t?cheb(c.hero,t):0;
    const atkLeft=c.attacksLeft>0?` (${c.attacksLeft} more attack${c.attacksLeft>1?'s':''} in this Attack action)`:'';
    const wBtns=heroWeapons().map(id=>{const w=WEAPONS[id],issue=rangeIssue(w.kind,1,w.long||w.range),off=issue||(c.actions<1&&c.attacksLeft<1);
      return btn('act',`${w.name}${issue?`: ${issue}`:''}`,`data-k="${id}" ${disab(off)}`,!issue&&w.kind==='melee'?'btn':'btn ghost')}).join('');
    const pickRow=c.pick?(()=>{const isSm=c.pick==='smite',lv=isSm?[1,2,3,4,5].filter(l=>h.pools['slot'+l]>0):upcastLevels(c.pick),nm=isSm?'Divine Smite':SPELLS[c.pick].name;
      return `<div class="pickrow"><p><b>${nm}:</b> which slot level? Higher slots make it stronger.</p><div class="actions">${lv.map(l=>btn('act',`Level ${l} (${h.pools['slot'+l]} left)`,`data-k="up:${c.pick}:${l}"`,'btn small')).join('')}${btn('act','Cancel','data-k="cancelpick"','btn ghost small')}</div></div>`})():'';
    const spBtns=shape()?'':knownSpells().filter(id=>!['shield','magearmor','hellishrebuke'].includes(id)).map(id=>{const s=SPELLS[id],issue=spellIssue(id),pl=!issue&&s.lvl?plannedSlot(id):0;
      return btn('act',`${s.name}${s.cast==='bonus'?' (bonus)':''}${pl&&pl>s.lvl?` at level ${pl}`:''}${issue&&!['action used','bonus action used'].includes(issue)?`: ${issue}`:''}`,`data-k="${id}" ${disab(issue)}`,pl&&pl>s.lvl?'btn small':'btn ghost small')}).join('');
    const mp=maxPools(h),lvls=isWarlock(h)?[]:[1,2,3,4,5,6,7,8,9].filter(l=>mp['slot'+l]);
    const lvlRow=lvls.length>1&&!shape()?`<div class="lvlrow"><span class="meta">Cast at:</span>${btn('act','Lowest','data-k="lvl:0"',castLvl()?'btn ghost small':'btn small')}${lvls.map(l=>btn('act',`Level ${l} (${h.pools['slot'+l]||0})`,`data-k="lvl:${l}" ${disab(!h.pools['slot'+l])}`,castLvl()===l?'btn small':'btn ghost small')).join('')}</div>`:'';
    const splitRow=c.split?(()=>{const sp=c.split,tot=Object.values(sp.alloc).reduce((a,b)=>a+b,0);
      return `<div class="pickrow"><p><b>${SPELLS[sp.id].name}${sp.slot>SPELLS[sp.id].lvl?` (level ${sp.slot})`:''}:</b> aim your ${sp.n} ${MULTI[sp.id]}. ${sp.n-tot?`${sp.n-tot} left to assign.`:'All assigned.'}</p>
        <ul class="ledger">${multiTargets(sp.id).map(i=>{const f=c.foes[i],k=sp.alloc[i]||0;return `<li class="row"><span><b>${f.label}</b> ${f.name} <span class="meta">${f.hp}/${f.hpMax} HP</span></span><span class="split">${btn('act','−',`data-k="split-:${i}" ${disab(!k)}`,'btn ghost small')}<b>${k}</b>${btn('act','+',`data-k="split+:${i}" ${disab(tot>=sp.n)}`,'btn ghost small')}</span></li>`}).join('')}</ul>
        <div class="actions">${btn('act','Fire','data-k="splitgo" '+disab(tot!==sp.n),'btn')}${btn('act','Cancel','data-k="splitcancel"','btn ghost small')}</div></div>`})():'';
    const f=[];
    if(h.cls==='fighter'){f.push(btn('act',`Second Wind (bonus), ${h.pools.secondwind}`,`data-k="secondwind" ${disab(!c.bonus||!h.pools.secondwind)}`,'btn ghost small'));
      if(h.level>=2)f.push(btn('act',`Action Surge, ${h.pools.surge}`,`data-k="surge" ${disab(!h.pools.surge)}`,'btn ghost small'))}
    if(h.cls==='rogue'){if(h.level>=2){f.push(btn('act','Hide (bonus)',`data-k="hide" ${disab(!c.bonus||liveFoes().some(x=>los(c,x,c.hero)))}`,'btn ghost small'),btn('act','Dash (bonus)',`data-k="cdash" ${disab(!c.bonus)}`,'btn ghost small'),btn('act','Disengage (bonus)',`data-k="cdis" ${disab(!c.bonus)}`,'btn ghost small'))}
      if(h.level>=3)f.push(btn('act','Steady Aim (bonus)',`data-k="aim" ${disab(!c.bonus||c.moved)}`,'btn ghost small'))}
    if(h.cls==='cleric'&&h.level>=2){f.push(btn('act',`Divine Spark: heal, ${h.pools.cd}`,`data-k="sparkheal" ${disab(c.actions<1||!h.pools.cd)}`,'btn ghost small'),btn('act','Divine Spark: harm',`data-k="sparkharm" ${disab(c.actions<1||!h.pools.cd||!t||rangeIssue('ranged',6,6))}`,'btn ghost small'),btn('act','Turn Undead',`data-k="turn" ${disab(c.actions<1||!h.pools.cd)}`,'btn ghost small'))}
    if(h.conc==='spiritualweapon')f.push(btn('act','Spiritual Weapon strike (bonus)',`data-k="spiritual" ${disab(!c.bonus||!t||rangeIssue('ranged',12,12))}`,'btn ghost small'));
    if(h.cls==='wizard'&&h.level>=14)f.push(btn('act',c.overchannel?'Overchannel: ready':`Overchannel, ${h.pools.overchannel}`,`data-k="overchannel" ${disab(c.overchannel||!h.pools.overchannel)}`,c.overchannel?'btn small':'btn ghost small'));
    if(h.cls==='ranger'&&h.level>=14)f.push(btn('act',`Nature’s Veil (bonus), ${h.pools.veil}`,`data-k="veil" ${disab(!c.bonus||!h.pools.veil)}`,'btn ghost small'));
    if(h.cls==='barbarian'&&h.level>=14)f.push(btn('act',`Intimidating Presence (bonus), ${h.pools.intim}`,`data-k="intim" ${disab(!c.bonus||!h.pools.intim)}`,'btn ghost small'));
    if(h.cls==='warlock'&&h.level>=14)f.push(btn('act',c.hurlNext?'Hurl Through Hell: ready':`Hurl Through Hell, ${h.pools.hurl}`,`data-k="hurl" ${disab(c.hurlNext||!h.pools.hurl)}`,c.hurlNext?'btn small':'btn ghost small'));
    if(h.cls==='barbarian'){f.push(btn('act',c.rage?'Raging':`Rage (bonus), ${h.pools.rage}`,`data-k="rage" ${disab(c.rage||!c.bonus||!h.pools.rage)}`,c.rage?'btn small':'btn ghost small'));
      if(h.level>=2)f.push(btn('act',c.reckless?'Reckless this turn':'Reckless Attack',`data-k="reckless" ${disab(c.reckless)}`,c.reckless?'btn small':'btn ghost small'));
      if(h.level>=9)f.push(btn('act',c.brutalNext?'Brutal Strike: ready':'Ready Brutal Strike',`data-k="brutal" ${disab(!c.reckless||c.brutalNext)}`,'btn ghost small'))}
    if(h.cls==='druid'){if(shape())f.push(btn('act',`Return to your form (bonus)`,`data-k="revert" ${disab(!c.bonus)}`,'btn ghost small'));
      else if(h.level>=2)Object.entries(FORMS).filter(([,fm])=>h.level>=fm.minL).forEach(([id,fm])=>f.push(btn('act',`Wild Shape: ${fm.name} (${h.pools.ws})`,`data-k="ws:${id}" ${disab(!c.bonus||!h.pools.ws)}`,'btn ghost small')));
      if(h.level>=5&&!h.pools.ws&&h.pools.resurge)f.push(btn('act','Wild Resurgence (spend a slot)',`data-k="resurge" ${disab(!slotFor(1))}`,'btn ghost small'));
      if(h.conc==='calllightning')f.push(btn('act','Call down a lightning bolt',`data-k="bolt2" ${disab(c.actions<1)}`,'btn small'));
      if(h.conc==='moonbeam')f.push(btn('act','Move the Moonbeam',`data-k="mbeam" ${disab(c.actions<1)}`,'btn ghost small'));
      if(h.level>=10)f.push(btn('act',`Moonlight Step, ${h.pools.mstep}`,`data-k="mstep" ${disab(!c.bonus||!h.pools.mstep)}`,'btn ghost small'))}
    if(h.cls==='paladin'){f.push(btn('act',`Lay on Hands (bonus), ${h.pools.loh}`,`data-k="loh" ${disab(!c.bonus||!h.pools.loh||(h.hp>=h.hpMax&&!h.conds.poisoned))}`,'btn ghost small'));
      if(h.level>=2)f.push(btn('act',c.smiteNext?'Divine Smite: ready':`Ready Divine Smite${h.pools.freesmite?' (free)':''}`,`data-k="smite" ${disab(!h.pools.freesmite&&!slotFor(1))}`,c.smiteNext?'btn small':'btn ghost small'));
      if(h.level>=3)f.push(btn('act',c.sacred?'Sacred Weapon active':`Sacred Weapon, ${h.pools.cd}`,`data-k="sacred" ${disab(c.sacred||!h.pools.cd)}`,'btn ghost small'));
      if(h.level>=9)f.push(btn('act','Abjure Foes',`data-k="abjure" ${disab(c.actions<1||!h.pools.cd)}`,'btn ghost small'))}
    if(h.cls==='ranger'){if(h.conc==='huntersmark'&&(!c.foes[c.markTarget]||c.foes[c.markTarget].hp<=0))f.push(btn('act','Move Hunter’s Mark (bonus)',`data-k="movemark" ${disab(!c.bonus||!t)}`,'btn small'));
      if(h.level>=10)f.push(btn('act',`Tireless, ${h.pools.tireless}`,`data-k="tireless" ${disab(c.actions<1||!h.pools.tireless)}`,'btn ghost small'))}
    if(h.cls==='monk'){f.push(btn('act','Bonus unarmed strike',`data-k="mastrike" ${disab(!c.bonus||!t||rangeIssue('melee',1,1))}`,'btn ghost small'));
      if(h.level>=2)f.push(btn('act',`Flurry of Blows, ${h.pools.focus} focus`,`data-k="flurry" ${disab(!c.bonus||!h.pools.focus||!t||rangeIssue('melee',1,1))}`,'btn ghost small'),
        btn('act','Patient Defense',`data-k="patient" ${disab(!c.bonus)}`,'btn ghost small'),btn('act','Patient Defense + Dodge (1)',`data-k="patientf" ${disab(!c.bonus||!h.pools.focus)}`,'btn ghost small'),
        btn('act','Step of the Wind',`data-k="stepwind" ${disab(!c.bonus)}`,'btn ghost small'),btn('act','Step of the Wind + Disengage (1)',`data-k="stepwindf" ${disab(!c.bonus||!h.pools.focus)}`,'btn ghost small'));
      if(h.level>=5)f.push(btn('act',c.stunNext?'Stunning Strike: ready':'Ready Stunning Strike (1)',`data-k="stun" ${disab(!h.pools.focus||c.stunUsed)}`,c.stunNext?'btn small':'btn ghost small'));
      if(h.level>=6)f.push(btn('act',`Wholeness of Body, ${h.pools.wholeness}`,`data-k="wholeness" ${disab(!c.bonus||!h.pools.wholeness)}`,'btn ghost small'))}
    if(h.cls==='sorcerer'){f.push(btn('act',c.innate?'Innate Sorcery active':`Innate Sorcery (bonus), ${h.pools.innate}`,`data-k="innate" ${disab(c.innate||!c.bonus||(!h.pools.innate&&!(h.level>=7&&h.pools.sp>=2)))}`,'btn ghost small'));
      if(h.level>=2){f.push(btn('act',c.quicken?'Quickened: next spell':`Quicken next spell (2 of ${h.pools.sp})`,`data-k="quicken" ${disab(c.quicken||h.pools.sp<2)}`,c.quicken?'btn small':'btn ghost small'),
        btn('act',c.careful?'Careful: next area spell':'Careful Spell (1)',`data-k="careful" ${disab(c.careful||h.pools.sp<1)}`,c.careful?'btn small':'btn ghost small'));
        [[1,2],[2,3],[3,5]].filter(([l])=>SLOTS[h.level].length>=l).forEach(([l,cost])=>f.push(btn('act',`Font: level ${l} slot (${cost})`,`data-k="font${l}" ${disab(!c.bonus||h.pools.sp<cost)}`,'btn ghost small')))}}
    if(h.cls==='warlock'){if(h.conc==='hex'&&(!c.foes[c.hexTarget]||c.foes[c.hexTarget].hp<=0))f.push(btn('act','Move Hex (bonus)',`data-k="movehex" ${disab(!c.bonus||!t)}`,'btn small'));
      if(h.level>=5)f.push(btn('act','Fiendish Vigor (12 temp HP)',`data-k="vigor" ${disab(c.actions<1)}`,'btn ghost small'))}
    if(h.species==='orc')f.push(btn('act',`Adrenaline Rush (bonus), ${h.pools.rush}`,`data-k="rush" ${disab(!c.bonus||!h.pools.rush)}`,'btn ghost small'));
    if(h.cls==='cleric'&&h.level>=10)f.push(btn('act',c.freeCast?'Divine Intervention ready':`Divine Intervention, ${h.pools.di||0}`,`data-k="di" ${disab(!h.pools.di||c.freeCast)}`,'btn ghost small'));
    {const it=(h.items||[]).find(i=>i.id==='wandmm');if(it)f.push(btn('act',`Wand of Magic Missiles, ${it.charges}`,`data-k="wandmm" ${disab(c.actions<1||!it.charges||!t||rangeIssue('ranged',24,24))}`,'btn ghost small'))}
    if(S.inv.superior)f.push(btn('act',`Superior healing (bonus), ${S.inv.superior}`,`data-k="superior" ${disab(!c.bonus)}`,'btn ghost small'));
    if(S.inv.heroism)f.push(btn('act',`Potion of Heroism (bonus), ${S.inv.heroism}`,`data-k="heroism" ${disab(!c.bonus||h.conds.heroism)}`,'btn ghost small'));
    if(hasFeat('lucky'))f.push(btn('act',`Lucky: advantage, ${h.pools.luck}`,`data-k="lucky" ${disab(!h.pools.luck||c.lucky)}`,'btn ghost small'));
    if(c.lastMiss&&h.pools.insp)f.push(btn('act','Reroll that attack (Heroic Inspiration)','data-k="reroll"','btn small'));
    if(c.lastMiss&&h.pools.luck)f.push(btn('act',`Reroll that attack (Lucky, ${h.pools.luck})`,'data-k="rerollluck"','btn small'));
    controls=`
    <p class="turnline"><b>Your turn.</b> Move ${ft(c.move)} ft. Action ${c.actions>0?(c.actions>1?`×${c.actions}`:'ready'):'used'}${atkLeft}. Bonus ${c.bonus?'ready':'used'}. Reaction ${c.react?'ready':'used'}.${c.adv?' Next attack has advantage.':''}${c.lucky?' Lucky is set.':''}${c.hidden?' You’re hidden.':''}${c.disengaged?' Disengaged.':''}${c.heroProne?' You’re prone.':''}${c.heroPara?' You’re paralyzed.':''}${c.grappledBy!=null?' You’re restrained.':''}</p>
    <p class="meta">${t?`Target: ${t.label} ${t.name}, ${ft(tDist)} ft away.`:''} Tap a lit square to move, or an enemy to target it.</p>
    <div class="actions">${wBtns}</div>
    ${splitRow}${pickRow}${shape()?`<p class="meta">You’re a ${shape().name.toLowerCase()}: no spellcasting until you return to your own form.</p>`:''}${spBtns?`<details class="group" open>${''}<summary>Spells${isCaster()?`: ${slotSummary(h)}${h.cls==='sorcerer'&&h.level>=2?`, ${h.pools.sp} sorcery points`:''}`:''}</summary>${lvlRow}<div class="actions">${spBtns}</div></details>`:''}
    ${f.length?`<details class="group" open><summary>Features</summary><div class="actions">${f.join('')}</div></details>`:''}
    <details class="group"><summary>Other actions</summary><div class="actions">
      ${btn('act','Dash','data-k="dash" '+disab(c.actions<1),'btn ghost small')}${btn('act','Disengage','data-k="disengage" '+disab(c.actions<1),'btn ghost small')}${btn('act','Dodge','data-k="dodge" '+disab(c.actions<1),'btn ghost small')}
      ${btn('act',`Potion (bonus), ${S.inv.potion}`,`data-k="potion" ${disab(!c.bonus||!S.inv.potion)}`,'btn ghost small')}${S.inv.greater?btn('act',`Greater potion (bonus), ${S.inv.greater}`,`data-k="greater" ${disab(!c.bonus)}`,'btn ghost small'):''}${btn('act','Escape (from an edge)','data-k="escape" '+disab(c.actions<1||!onEdge()),'btn ghost small')}</div></details>
    ${c.grappledBy!=null?`<div class="actions">${btn('act','Break free (Athletics or Acrobatics)','data-k="breakfree" '+disab(c.actions<1),'btn')}</div>`:''}
    <div class="actions">${btn('act','End turn','data-k="end"',c.actions<1&&c.attacksLeft<1&&!c.bonus?'btn':'btn ghost')}</div>`;
  }
  const groups=[];
  for(const l of c.log.slice(-30)){if(l.kind==='head')groups.push({head:l,items:[]});else{if(!groups.length)groups.push({head:null,items:[]});groups[groups.length-1].items.push(l)}}
  const logHTML=groups.reverse().map(g=>(g.head?`<li class="head">${g.head.text}</li>`:'')+g.items.slice().reverse().map(l=>`<li class="${l.kind}">${l.text}</li>`).join('')).join('');
  return `${st.text?`<p class="prose">${st.text}</p>`:''}${order}
  <div class="board" role="grid" aria-label="Battle map, 5 ft squares">${cells}</div>
  <div class="foelist">${c.foes.map((f,i)=>{const tags=condTags(f);return `<button class="foe ${f.hp<=0?'dead':''} ${t===f&&!c.over?'target':''}" data-a="target" data-i="${i}" ${disab(f.hp<=0||c.over)}>
    <span><b>${f.label}</b> ${f.name} <span class="meta">AC ${f.ac}, speed ${ft(f.speed)} ft, ${f.type}${f.ranged?`, ${f.ranged.name}`:''}${tags.length?`, ${tags.join(', ')}`:''}</span></span><span class="meta">${f.hp<=0?'Down':`${f.hp}/${f.hpMax} HP`}</span>
    <span class="bar foehp"><i style="width:${pct(f.hp,f.hpMax)}%"></i></span></button>`}).join('')}</div>
  ${controls}
  <ol class="clog" aria-live="polite">${logHTML}</ol>`;
}
const disab=c=>c?'disabled':'';

function renderActModal(){
  return `<div class="adv" role="dialog" aria-modal="true" aria-label="Act 1 complete"><div class="adv-inner">
  <p class="meta">End of Act 1</p><h1>Hollowmere is a hamlet again</h1>
  <p class="prose">Smoke rises from working chimneys. The Flagon is loud on a weeknight. Families who left years ago send letters asking if there’s room.</p>
  <p class="prose">But the tunnel behind the cracked seal goes deeper than any lantern reaches, and Maren has finally started talking about the Order of the Shut Eye.</p>
  <p class="prose">Act 2 begins now: new buildings are open on the town map, and the notice board has a way into the mine.</p>
  <div class="actions">${btn('closeact','Keep playing','','btn big')}</div></div></div>`;
}

/* ================= ACTIONS ================= */
const A={
  create(){
    const name=(($('#hname')||{}).value||draft.name||'').trim()||'Wanderer';draft.name=name;
    if(S&&S.flags.respec){
      const old=S.hero;
      S.hero=buildHero({...draft,avatar:draft.avatar||old.avatar,level:old.level,xp:old.xp,gear:old.gear,owned:old.owned});
      S.hero.items=(old.items||[]).map(i=>({...i,attuned:false}));
      S.flags.respec=false;S.flags.mysticUsed=true;
      addLog(`${name} drinks Sable’s draught and wakes as a ${SPECIES[S.hero.species].name.toLowerCase()} ${CLASSES[S.hero.cls].name.toLowerCase()}.`,'good');
      note('You wake changed. Sable is gone, and her wagon with her. Remember to re-attune your magic items on the Hero tab.');
    }else if(S&&(S.flags.rebuild||S.flags.fallen)){
      const old=S.hero,keep=S.flags.rebuild;
      S.hero=buildHero({...draft,avatar:draft.avatar||(keep?old.avatar:null),level:keep?old.level:1,xp:keep?old.xp:0,gear:keep?old.gear:undefined,owned:keep?old.owned:undefined});
      addLog(keep?`${name} is rebuilt under the full rules.`:`${name} arrives to take up the fallen hero’s work.`,'good');
      S.flags.rebuild=false;S.flags.fallen=false;S.v=2;S.run=null;
    }else{S=normalize(newState(draft));S.flags.note=INTRO;addLog(`${name} arrives in Hollowmere.`)}
    draft=null;commit();window.scrollTo(0,0);
  },
  avatar(){const n=$('#hname');if(n&&draft)draft.name=n.value;$('#avatarfile').click()},
  avatarclear(){if(draft&&(!S||S.flags.rebuild||S.flags.fallen)){draft.avatar=null;render()}else{S.hero.avatar=null;commit()}},
  plot(ds){selPlot=selPlot===ds.k?null:ds.k;render()},
  respec(){if(!S.flags.mystic||S.flags.mysticUsed||S.run)return;S.flags.respec=true;draft=null;render();window.scrollTo(0,0)},
  cancelrespec(){S.flags.respec=false;draft=null;render()},
  tab(ds){S.tab=ds.t;save();render();window.scrollTo(0,0)},
  note(){S.flags.note=null;commit()},
  sleep(){sleep()},
  build(ds){startBuild(ds.k)},
  focus(ds){S.focus=ds.k;commit()},
  chore(ds){doChore(ds.k)},
  labor(){labor()},
  hire(ds){hire(+ds.i)},
  fire(ds){const w=S.workers.find(x=>x.id==ds.id);if(w&&confirm(`Let ${w.name} go?`)){S.workers=S.workers.filter(x=>x!==w);addLog(`${w.name} moves on.`);commit()}},
  water(){water()},
  plant(ds){seedPlot=null;plant(+ds.i,ds.c)},
  seedpick(ds){seedPlot=seedPlot===+ds.i?null:+ds.i;render();setTimeout(()=>{const el=document.querySelector('.pickrow');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})},30)},
  seedcancel(){seedPlot=null;render()},
  harvest(ds){harvest(+ds.i)},
  ship(ds){S.bin[ds.k]+=S.inv[ds.k];S.inv[ds.k]=0;commit()},
  mill(){if(S.inv.wheat<1)return;S.inv.wheat--;S.res.food+=2;commit()},
  brew(){if(S.inv.moon<1||S.res.gold<5)return;S.inv.moon--;S.res.gold-=5;S.inv.potion++;addLog('Ilsa brews you a healing potion from moonblossom.');commit()},
  talk(ds){talk(ds.n)},
  gift(ds){gift(ds.n,ds.k)},
  buypotion(){const p=potionPrice(),st=weeklyStock();if(S.res.gold<p||st.ilsa<1)return;st.ilsa--;S.res.gold-=p;S.inv.potion++;commit()},
  peddle(ds){buyPeddler(ds.k)},
  greater(){const h=S.hero;if(!S.inv.greater||h.hp>=h.hpMax||(S.run&&S.run.combat))return;S.inv.greater--;const r=roll('4d4+4');h.hp=Math.min(h.hpMax,h.hp+r.total);addLog(`You drink a greater healing potion and heal ${r.total}.`);commit()},
  potion(){const h=S.hero;if(!S.inv.potion||h.hp>=h.hpMax||(S.run&&S.run.combat))return;S.inv.potion--;const r=roll('2d4+2');h.hp=Math.min(h.hpMax,h.hp+r.total);addLog(`You drink a potion and heal ${r.total}.`);commit()},
  heal(ds){const h=S.hero,sp=SPELLS[ds.k];if(!S.run||S.run.combat||!knownSpells().includes(ds.k))return;const l=slotFor(1);if(!l)return;useSlot(l);
    const n=2*(1+l-1),s=ds.k==='curewounds'?8:4,dice=rollDice(n,s),amt=dice.reduce((a,b)=>a+b,0)+spellMod()+(h.cls==='cleric'&&h.level>=3?2+l:0);h.hp=Math.min(h.hpMax,h.hp+amt);
    S.run.restNote=null;addLog(`${sp.name}: you heal ${amt}.`);commit()},
  quest(ds){startRun(ds.q)},
  cont(){
    const r=S.run;if(!r)return;
    if(r.combat&&r.combat.over){const o=r.combat.over;if(o==='win'){r.combat=null;nextStage(curStage().goto)}else finishRun(false,o==='fled'?'fled':o==='dead'?'dead':'defeat');return commit()}
    if(r.pending&&r.pending.final){const g=r.pending.final.goto;r.pending=null;nextStage(g);return commit()}
    const st=curStage();if(st&&st.t==='text'&&!r.pending){nextStage(st.goto);commit()}
  },
  check(){const st=curStage();if(!st||S.run.pending)return;
    if(st.t==='check')resolveCheck({skill:st.skill,dc:st.dc},st.pass,st.fail);
    else if(st.t==='save')resolveCheck({save:st.save,dc:st.dc,vs:st.vs},st.pass,st.fail);
    commit()},
  choose(ds){const st=curStage(),o=st.options[+ds.i];if(!o||S.run.pending||(o.if&&!COND[o.if]()))return;if(o.check)resolveCheck({skill:o.check.skill,dc:o.check.dc},o.check.pass,o.check.fail);else nextStage(o.goto);commit()},
  reroll(ds){rerollCheck(ds.k);commit()},
  accept(){acceptCheck();commit()},
  shortrest(){shortRest();commit()},
  hitdie(){spendHitDie();commit()},
  endrest(){if(S.run){S.run.resting=false;S.run.restNote=null}commit()},
  target(ds){const c=S.run&&S.run.combat;if(c&&!c.aim&&c.foes[+ds.i]&&c.foes[+ds.i].hp>0){c.target=+ds.i;commit()}},
  act(ds){const snap=S.run&&S.run.combat?snapshot():null;combatAction(ds.k);diffFX(snap);commit()},
  cell(ds){const snap=S.run&&S.run.combat?snapshot():null;moveHero(+ds.x,+ds.y);diffFX(snap);const c=S.run&&S.run.combat;if(c)checkWin();commit()},
  endrun(){const dead=S.run&&S.run.result&&S.run.result.dead;S.run=null;if(dead){S.flags.fallen=true;draft=null}window.scrollTo(0,0);commit()},
  closeact(){S.flags.actModal=false;commit()},
  closeact2(){S.flags.act2Modal=false;commit()},
  closeend(){S.flags.endModal=false;commit()},
  sequelintro(){S.flags.sequelModal=true;render()},
  closesequel(){S.flags.sequelModal=false;render()},
  beginsequel(){S.flags.sequelModal=false;S.flags.sequel=true;addLog('You accept the Abbess’s charge. You are the Warden of the Shut Eye.','good');note('The Seven Seals has begun. The level cap rises to 14, and Chapter 1 is waiting on the notice board.');checkLevel();commit()},
  closech2(){S.flags.ch2Modal=false;commit()},
  smith(ds){buySmithy(ds.k)},
  upgrade(ds){startUpgrade(ds.k)},
  lohq(){const h=S.hero;if(!S.run||S.run.combat||h.cls!=='paladin'||!h.pools.loh)return;if(h.conds.poisoned&&h.pools.loh>=5){h.pools.loh-=5;delete h.conds.poisoned}else{const n=Math.min(h.pools.loh,h.hpMax-h.hp);h.pools.loh-=n;h.hp+=n}commit()},
  cunning(){const h=S.hero;if(!S.run||S.run.combat||h.cls!=='warlock'||!h.pools.cunning)return;h.pools.cunning=0;h.pools.pact=Math.min(PACT[h.level][0],h.pools.pact+Math.ceil(PACT[h.level][0]/2));addLog('Magical Cunning: you regain pact slots.');commit()},
  vigorq(){const h=S.hero;if(!S.run||S.run.combat||h.cls!=='warlock'||h.level<5)return;h.temp=Math.max(h.temp,12);commit()},
  buysup(){const st=weeklyStock();if(lvl('chapel')<3||!st.superior||S.res.gold<150)return;st.superior--;S.res.gold-=150;S.inv.superior=(S.inv.superior||0)+1;addLog('The sisters sell you a superior healing potion.');commit()},
  buymagic(ds){buyMagic(ds.k)},
  sellmagic(ds){sellMagic(+ds.i)},
  attune(ds){const it=S.hero.items[+ds.i];if(!it||S.run||attunedCount()>=3||!usable(it.id))return;it.attuned=true;const oldMax=S.hero.hpMax;S.hero.hpMax=maxHP(S.hero);S.hero.hp+=Math.max(0,S.hero.hpMax-oldMax);addLog(`You attune to ${MAGIC[it.id].name}.`);commit()},
  unattune(ds){const it=S.hero.items[+ds.i];if(!it||S.run)return;it.attuned=false;S.hero.hpMax=maxHP(S.hero);S.hero.hp=Math.min(S.hero.hp,S.hero.hpMax);commit()},
  drinksup(){const h=S.hero;if(!S.inv.superior||h.hp>=h.hpMax||(S.run&&S.run.combat))return;S.inv.superior--;const r=roll('8d4+8');h.hp=Math.min(h.hpMax,h.hp+r.total);addLog(`You drink a Potion of Superior Healing and heal ${r.total}.`);commit()},
  drinkhero(){const h=S.hero;if(!S.inv.heroism||!S.run||S.run.combat||h.conds.heroism)return;S.inv.heroism--;h.conds.heroism=true;h.temp=Math.max(h.temp,10);addLog('You drink a Potion of Heroism.');commit()},
  sellms(){if(!built('market')||!S.res.moonsilver)return;S.res.moonsilver--;S.res.gold+=lvl('market')>=3?25:15;commit()},
  buygreater(){const st=weeklyStock();if(!built('chapel')||S.res.gold<50||st.chapel<1)return;st.chapel--;S.res.gold-=50;S.inv.greater++;addLog('The sisters sell you a greater healing potion.');commit()},
  exportsave(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hollowmere-day-${S.day}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
  importsave(){$('#importfile').click()},
  reset(){if(confirm('Start a new game? Your current save in this browser will be erased.')){try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;draft=null;render()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='hname'&&draft)draft.name=e.target.value});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-assign]')){const w=S.workers.find(x=>x.id==t.dataset.assign);if(w){w.assign=t.value;commit()}}
  if(t.matches('[data-flag]')){S.flags[t.dataset.flag]=t.checked;commit()}
  if(t.matches('[data-draft]')){draft[t.dataset.draft]=t.value;if(t.dataset.draft==='cls')draft.abil={...CLASSES[t.value].array};render()}
  if(t.matches('[data-abil]')){const k=t.dataset.abil,v=+t.value,other=ABIL.find(a=>a!==k&&draft.abil[a]===v);if(other)draft.abil[other]=draft.abil[k];draft.abil[k]=v;render()}
  if(t.id==='avatarfile'&&t.files[0]){loadAvatar(t.files[0]);t.value=''}
  if(t.id==='importfile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o&&(o.v===1||o.v===2)&&o.hero){S=normalize(migrate(o));commit()}else alert('That file isn’t a Hollowmere save.')}catch(err){alert('That file couldn’t be read as a save.')}t.value=''};fr.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hname')A.create();
  const el=e.target.closest&&e.target.closest('[data-a][role="button"]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const f=A[el.dataset.a];if(f)f(el.dataset)}});
function migrate(o){
  if(o.v===1){o.flags=o.flags||{};o.flags.rebuild=true;o.run=null}
  return o;
}
S=load();if(S)S=normalize(migrate(S));
if(S&&S.v===2&&S.run&&S.run.combat&&S.run.combat.board!==2){const st=curStage();if(st&&st.t==='fight')startCombat(st.foes);else S.run.combat=null}
if(S&&S.run&&S.run.combat&&!S.run.combat.cid)S.run.combat.cid=Math.random().toString(36).slice(2);
if(S&&S.run&&S.run.combat&&!S.run.combat.over&&S.run.combat.turn!=='hero'){S.run.combat.acting=null;runTurns()}
render();

</script>
</body>
</html>
