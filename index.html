  return `<div class="townmap"><svg viewBox="0 0 360 320" role="group" aria-label="Map of Hollowmere">${defs}${land}${drawWalls()}${plots}${grid}<rect width="360" height="200" fill="url(#blightfog)" pointer-events="none"/></svg></div>`;
}
function renderPlotPanel(){
  const k=selPlot;
  if(k==='wagon'){if(!merchantHere())return '<div class="plotpanel"><p class="meta">The wagon has gone.</p></div>';return `<div class="plotpanel"><div class="row"><h3>Mirela’s wagon</h3><span class="tag prog">Here now</span></div><p>Bells, glass charms and a smell of incense. Mirela sells magic items and buys them back at half price.</p><div class="actions">${btn('tab','Browse her wares','data-t="folk"','btn small')}</div></div>`}
  if(!k)return `<div class="plotpanel"><p class="meta">Tap a site on the map to build, salvage or check on it.</p></div>`;
  const p=MAP_PLOTS[k];let html=`<div class="plotpanel"><div class="row"><h3>${esc(plotName(k))}</h3>`;
  if(p.kind==='building'){
    const b=BUILDINGS[k],st=S.buildings[k],lockText=st.status==='none'&&buildingLock(k),locked=!!lockText;
    html+=`${st.status==='done'?`<span class="tag done">${lvl(k)>=2&&!upgrading(k)?`Level ${lvl(k)}`:upgrading(k)?(S.focus===k?'Upgrading now':'Upgrade paused'):'Built'}</span>`:st.status==='building'?`<span class="tag prog">${S.focus===k?'Building now':'Paused'}</span>`:locked?'<span class="tag lock">Locked</span>':'<span class="tag">Ruined</span>'}</div><p>${b.benefit}</p>`;
    if(st.status==='none'){
      if(locked)html+=`<p class="meta">${lockText}</p>${b.tier!==2?`<div class="actions">${btn('tab','Open the notice board','data-t="quests"','btn ghost small')}</div>`:''}`;
      else{const short=Object.entries(b.cost).filter(([r,v])=>S.res[r]<v).map(([r,v])=>`${v-S.res[r]} more ${r==='gold'?'gp':r}`);
        html+=`<p class="meta">Cost: ${costText(b.cost)}. Then ${b.bp} build points of work.${short.length?` You need ${short.join(' and ')}.`:''}</p><div class="actions">${btn('build',`Start building`,`data-k="${k}" ${dis(!canAfford(b.cost))}`)}</div>`}
    }else if(st.status==='building'){
      html+=`<div class="bar" style="height:10px;margin:8px 0 4px"><i style="width:${pct(st.bp,b.bp)}%"></i></div><p class="meta">${st.bp} of ${b.bp} build points. Workers on construction add 1 each night.</p>
      <div class="actions">${S.focus===k?btn('chore',(S.used.morning?'Adventure time: work on it (+1)':'Downtime: work on it (+1)'),`data-k="build" ${dis(S.used.morning&&S.used.day)}`)+btn('labor','All day: labor (+2)',dis(S.used.day),'btn ghost'):btn('focus','Work on this one next',`data-k="${k}"`,'btn ghost')}</div>`;
    }else{
      if(UPGRADES[k]){const u=nextUp(k),ul=upgradeLock(k),st2=S.buildings[k];
        if(lvl(k)>=2)html+=`<p class="meta">Level ${lvl(k)}: <b>${UPGRADES[k].name}</b>${lvl(k)>=3?` and <b>${UPGRADES3[k].name}</b>`:''} built.</p>`;
        if(lvl(k)>=3){}
        else if(upgrading(k))html+=`<p><b>Improving to level ${lvl(k)+1}: ${u.name}.</b> ${u.benefit}</p><div class="bar" style="height:10px;margin:8px 0 4px"><i style="width:${pct(st2.upBp,u.bp)}%"></i></div><p class="meta">${st2.upBp} of ${u.bp} build points.</p>
          <div class="actions">${S.focus===k?btn('chore',(S.used.morning?'Adventure time: work on it (+1)':'Downtime: work on it (+1)'),`data-k="build" ${dis(S.used.morning&&S.used.day)}`)+btn('labor','All day: labor (+2)',dis(S.used.day),'btn ghost'):btn('focus','Work on this one next',`data-k="${k}"`,'btn ghost')}</div>`;
        else if(ul)html+=`<p class="meta">Level ${lvl(k)+1}: ${u.name}. ${ul}</p>`;
        else{const cost=upgradeCost(k),short=Object.entries(cost).filter(([r,v])=>S.res[r]<v).map(([r,v])=>`${v-S.res[r]} more ${r==='gold'?'gp':r}`);
          html+=`<p><b>Level ${lvl(k)+1}: ${u.name}.</b> ${u.benefit}</p><p class="meta">Cost: ${costText(cost)}, then ${u.bp} build points.${lvl(k)===2&&lvl3Count()?` Costs rise with every level 3 project you complete (${lvl3Count()} so far).`:''}${short.length?` You need ${short.join(' and ')}.`:''}</p><div class="actions">${btn('upgrade','Start the upgrade',`data-k="${k}" ${dis(!canAfford(cost))}`,'btn small')}</div>`}}
      if(k==='lumber'||k==='quarry'){const n=S.workers.filter(w=>w.assign===k).length,ch=k==='lumber'?'chop':'cut';
        html+=`<p class="meta">${n} worker${n===1?'':'s'} here. Assign more in the Workers list below.</p><div class="actions">${btn('chore',CHORES[ch].label+(S.used.morning?' (Adventure time)':' (Downtime)'),`data-k="${ch}" ${dis(S.used.morning&&S.used.day)}`,'btn ghost')}</div>`}
      if(k==='flagon')html+=`<p class="meta">Bram is pouring again. New hires are listed under Workers below.</p>`;
      if(k==='well')html+=`<p class="meta">Housing for workers: ${housed()} of ${housingCap()}.</p>`;
      if(k==='farmstead')html+=`<div class="actions">${btn('tab','Go to the farm','data-t="farm"','btn ghost small')}</div>`;
      if(k==='smithy')html+=`<p class="meta">${S.flags.forge?'The forge is lit and Dorrin can work moonsilver.':S.quests.delve?'Dorrin hasn’t lit the forge yet. Check the notice board for “Dorrin’s fire.”':'Dorrin can do ordinary work. Moonsilver lies deeper in the mine.'} You have ${S.res.moonsilver} moonsilver.</p>
        <ul class="ledger">${SMITHY_ITEMS.map(it=>{const own=S.hero.owned.includes(it.id),cost=smithyCost(it),ok=(!it.forge||S.flags.forge)&&(!it.master||lvl('smithy')>=2)&&(!it.foundry||lvl('smithy')>=3);
          return `<li><div class="row"><span><b>${it.name}</b>. ${it.desc}</span>${own?'<span class="tag done">Owned</span>':btn('smith',`Buy for ${costText(cost)}`,`data-k="${it.id}" ${dis(!ok||!canAfford(cost))}`,'btn small')}</div>${!own&&!ok?`<p class="meta">${it.foundry?'Needs the Moonsilver foundry.':it.master?'Needs the Master forge upgrade.':'Needs Dorrin’s forge lit.'}</p>`:''}</li>`}).join('')}</ul>`;
      if(k==='chapel'&&lvl('chapel')>=3)html+=`<div class="row" style="margin-top:8px"><span>Superior healing potion: heals 8d4 + 8. ${weeklyStock().superior?'One available this week.':'Out until Monday.'}</span>${weeklyStock().superior?btn('buysup','150 gp',dis(S.res.gold<150),'btn small'):'<span class="tag">Sold out</span>'}</div>`;
      if(k==='chapel')html+=`<div class="row" style="margin-top:8px"><span>Greater healing potion: heals 4d4 + 4. You have ${S.inv.greater}. ${weeklyStock().chapel?`The sisters can spare ${weeklyStock().chapel} more this week.`:'The sisters are out until Monday.'}</span>${weeklyStock().chapel?btn('buygreater','50 gp',dis(S.res.gold<50),'btn small'):'<span class="tag">Sold out</span>'}</div>`;
      if(k==='market')html+=`<p class="meta">Traders pay ${lvl('market')>=3?25:15} gp for each lump of moonsilver. You have ${S.res.moonsilver}.</p><div class="actions">${btn('sellms','Sell 1 moonsilver',dis(!S.res.moonsilver),'btn ghost small')}${btn('tab','Visit Corwin’s stall','data-t="folk"','btn ghost small')}</div>`;
    }
  }else if(p.kind==='ruins'){
    const left=p.res==='timber'?S.salvage.timber:S.salvage.stone,ck=p.res==='timber'?'salvageTimber':'salvageStone';
    html+=`<span class="tag">${left} ${p.res} left</span></div><p>${p.res==='timber'?'Sagging roofs and doors you can strip for timber.':'Fallen walls of dressed stone you can haul away.'}</p>
    <div class="actions">${btn('chore',`${CHORES[ck].label} (morning)`,`data-k="${ck}" ${dis(S.used.morning||!left)}`,'btn ghost')}</div>`;
  }else if(p.kind==='fields'){
    const growing=S.plots.filter(x=>x.crop).length,ready=S.plots.filter(x=>x.crop&&x.days>=CROPS[x.crop].grow).length;
    html+=`</div><p>${S.plots.length} plot${S.plots.length>1?'s':''}: ${growing} growing${ready?`, ${ready} ready to harvest`:''}.</p><div class="actions">${btn('tab','Go to the farm','data-t="farm"','btn ghost small')}</div>`;
  }else if(p.kind==='mine'){
    const miners=S.workers.filter(w=>w.assign==='mine').length;
    html+=`<span class="tag ${S.quests.seal?'':'lock'}">${S.flags.act2?'Second seal broken':S.quests.seal?'Seal broken':'Sealed'}</span></div><p>${S.flags.act2?'Something vast stirs far below. The deep galleries are quiet, for now.':S.quests.seal?'The cracked door stands open. The old Varne workings go down into the hill.':'Boarded and sealed long ago. Whatever is behind it is leaking grey rot into the valley.'}</p>
    ${S.flags.warren?`<p class="meta">${miners} worker${miners===1?'':'s'} mining moonsilver. You have ${S.res.moonsilver}.</p>`:''}
    ${S.flags.act1&&S.quests.seal?`<div class="actions">${btn('tab','Open the notice board','data-t="quests"','btn ghost small')}</div>`:''}`;
  }else{
    html+=`<span class="tag lock">Hamlet tier</span></div><p class="meta">An empty lot, waiting. This becomes available once Hollowmere grows into a hamlet.</p>`;
  }
  return html+'</div>';
}
function renderTown(){
  const chores=['salvageTimber','salvageStone'].concat(built('lumber')?['chop']:[],built('quarry')?['cut']:[]);
  const tier=[[builtCount()>=4,`4 buildings finished (${builtCount()})`],[S.prosperity>=10,`10 Prosperity (${S.prosperity})`],[S.hero.level>=3,`You reach level 3 (${S.hero.level})`],[S.quests.seal,'Finish “The seal cracks”']];
  const rk=townRank(),dp=defenseParts();
  const raidBox=S.raid?`<div class="raidbox"><p><b>${S.raid.arrive>S.day?'Raid tomorrow':'Raid today'}: ${RAIDS[S.raid.type].name}.</b> ${RAIDS[S.raid.type].text}</p>
    <p class="meta">Raid strength ${S.raid.strength} against your defense of ${defense()}. ${S.raid.arrive>S.day?'Use today to prepare: assign guards or finish defenses.':`If you defend, you’ll fight ${raidFights()} group${raidFights()>1?'s':''}. If you don’t, ${S.raid.strength-defense()<=0?'your defenses should hold on their own.':'the town takes damage tonight.'}`}</p>
    ${S.raid.arrive<=S.day?`<div class="actions">${btn('quest','Defend the town','data-q="raid" '+dis(S.used.day),'btn')}</div>`:''}</div>`:'';
  return `${S.hero.pendingAsi||S.hero.pendingSub||S.hero.pendingStyle?`<div class="raidbox" style="border-color:var(--lantern)"><p><b>You have a level-up choice to make.</b></p><div class="actions">${btn('tab','Open the Hero tab','data-t="hero"','btn small')}</div></div>`:''}${raidBox}<h2>Hollowmere, ${rk.name.toLowerCase()}</h2>${rk.next?`<p class="meta">Next rank, ${rk.next}</p>`:'<p class="meta">Hollowmere is the seat of the whole valley: 5 bounties a week, 2 more housing, and 25 gp a week in tithes from the outlying farms.</p>'}
  ${renderMap()}${renderPlotPanel()}
  ${renderNewBuilds()}
  <h2>Defense: ${defense()}</h2>
  <p class="meta">${dp.length?dp.map(x=>`${x[0]} +${x[1]}`).join(', ')+'.':'Nothing yet.'} Raids sometimes hit the town once it’s a hamlet. Each point of defense stops one group of raiders, and a strong enough town drives them off on its own. Up to 3 workers can be assigned as guards.</p>
  <h2>Chores</h2>
  <p class="meta">${S.used.morning&&S.used.day?'You’ve used your Downtime and your Adventure time today.':S.used.morning?'Downtime is done. You can spend your Adventure time on another chore instead of a quest.':'Your Downtime chore. Pick one here or from a site on the map. You can also spend your Adventure time on a second chore.'}</p>
  <div class="actions">${S.focus?btn('chore',`Work on ${focusName()} (+1)`,`data-k="build" ${dis(S.used.morning&&S.used.day)}`,'btn ghost'):''}${chores.map(k=>{
    const left=k==='salvageTimber'?S.salvage.timber:k==='salvageStone'?S.salvage.stone:null;
    return btn('chore',`${CHORES[k].label}${left!==null?` (${left} left)`:''}`,`data-k="${k}" ${dis((S.used.morning&&S.used.day)||left===0||!!S.run)}`,S.used.morning?'btn ghost':'btn ghost');
  }).join('')}</div>
  ${renderWorkers()}
  <h2>${S.flags.act1?'Hollowmere is a hamlet':'Next: become a hamlet'}</h2>
  <ul class="checklist">${tier.map(([ok,t])=>`<li class="${ok?'ok':''}">${t}</li>`).join('')}</ul>`;
}

function jobHint(w){
  const kb=w.kind==='kobold'?1:0;
  return{build:'Adds 1 build point to the current project every night.',idle:'Resting. Still paid.',
    salvage:`Each week: 1d${w.die}${kb?' + 1':''} timber or stone from the ruins, whichever you have less of.`,
    lumber:`Each week: 1d${w.die} + ${3+(lvl('lumber')>=2?2:0)+(lvl('lumber')>=3?3:0)} timber.`.replace(' + 0',''),
    quarry:`Each week: 1d${w.die} + ${3+kb+(lvl('quarry')>=2?2:0)+(lvl('quarry')>=3?3:0)} stone.`.replace(' + 0',''),
    mine:'Each week: a chance at a lump of moonsilver.',guard:'+1 town defense against raids.'}[w.assign]||'';
}
function renderWorkers(){
  const opts=[['build','Construction'],['idle','Resting']].concat(S.salvage.timber+S.salvage.stone>0?[['salvage','Scavenge the ruins']]:[],built('lumber')?[['lumber','Lumber camp']]:[],built('quarry')?[['quarry','Quarry']]:[],S.flags.warren&&S.flags.ending!=='reseal'?[['mine','Mine (moonsilver)']]:[],S.flags.act1?[['guard','Guard (+1 defense)']]:[]);

    <div class="actions"><label class="meta">Job <select data-assign="${w.id}">${opts.map(([v,l])=>`<option value="${v}" ${w.assign===v?'selected':''}>${l}</option>`).join('')}</select></label>${btn('fire','Let go',`data-id="${w.id}"`,'btn ghost small')}</div></li>`).join('')}</ul>`;

function avatarHTML(src,name,cls,extra){
  return src?`<span class="${cls} img" style="background-image:url('${src}')" role="img" aria-label="${esc(name)}">${extra||''}</span>`
            :`<span class="${cls}" aria-hidden="true">${esc((name||'Y')[0].toUpperCase())}${extra||''}</span>`;
}
function loadAvatar(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const size=160,cv=document.createElement('canvas');cv.width=cv.height=size;
    const g=cv.getContext('2d'),side=Math.min(img.naturalWidth,img.naturalHeight);
    g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);
    const data=cv.toDataURL('image/jpeg',0.85);URL.revokeObjectURL(url);
    if(draft&&(!S||S.flags.rebuild||S.flags.fallen))draft.avatar=data;else if(S){S.hero.avatar=data;addLog('You chose a new token for your hero.')}
    S&&!draft?commit():render();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);alert('That image couldn’t be read. Try a JPEG or PNG.')};
  img.src=url;
}

  drinkhero(){const h=S.hero;if(!S.inv.heroism||!S.run||S.run.combat||h.conds.heroism)return;S.inv.heroism--;h.conds.heroism=true;h.temp=Math.max(h.temp,10);addLog('You drink a Potion of Heroism.');commit()},
  sellms(){if(!built('market')||!S.res.moonsilver)return;S.res.moonsilver--;S.res.gold+=lvl('market')>=3?25:15;commit()},
  buygreater(){const st=weeklyStock();if(!built('chapel')||S.res.gold<50||st.chapel<1)return;st.chapel--;S.res.gold-=50;S.inv.greater++;addLog('The sisters sell you a greater healing potion.');commit()},
  exportsave(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hollowmere-day-${S.day}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)},
  importsave(){$('#importfile').click()},
  reset(){if(confirm('Start a new game? Your current save in this browser will be erased.')){try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;draft=null;render()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='hname'&&draft)draft.name=e.target.value});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-assign]')){const w=S.workers.find(x=>x.id==t.dataset.assign);if(w){w.assign=t.value;commit()}}
  if(t.matches('[data-flag]')){S.flags[t.dataset.flag]=t.checked;commit()}
  if(t.matches('[data-act]')&&S&&S.run&&S.run.combat){A.act({k:t.dataset.act});return}
  if(t.matches('[data-draft]')){const f=t.dataset.draft;draft[f]=t.value;if(f==='cls'){draft.cantrips=null;draft.prepared=null;draft.book=null;draft.inv=null;draft.grafts=null;draft.abil=draft.method==='point'?{str:8,dex:8,con:8,int:8,wis:8,cha:8}:draft.method==='roll'&&draft.rolled?draft.abil:{...CLASSES[t.value].array};draft.classSkills=[];draft.style=null;draft.sub=null}if(f==='species'){draft.lineage=null;draft.bonusSkills=[]}if(f==='bg'){draft.bgPlus2=null;draft.bgPlus1=null;draft.classSkills=draft.classSkills.filter(x=>!BACKGROUNDS[t.value].skills.includes(x));draft.bonusSkills=[]}render()}
  if(t.matches('[data-abil]')){const k=t.dataset.abil,v=+t.value,other=ABIL.find(a=>a!==k&&draft.abil[a]===v&&(draft.method!=='roll'||true));if(other)draft.abil[other]=draft.abil[k];draft.abil[k]=v;render()}
  if(t.id==='avatarfile'&&t.files[0]){loadAvatar(t.files[0]);t.value=''}
  if(t.id==='importfile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o&&(o.v===1||o.v===2)&&o.hero){S=normalize(migrate(o));commit()}else alert('That file isn’t a Hollowmere save.')}catch(err){alert('That file couldn’t be read as a save.')}t.value=''};fr.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hname')A.create();
  const el=e.target.closest&&e.target.closest('[data-a][role="button"]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const f=A[el.dataset.a];if(f)f(el.dataset)}});
function migrate(o){
  if(o.v===1){o.flags=o.flags||{};o.flags.rebuild=true;o.run=null}
  return o;
}
S=load();if(S)S=normalize(migrate(S));
if(S&&S.v===2&&S.run&&S.run.combat&&S.run.combat.board!==2){const st=curStage();if(st&&st.t==='fight')startCombat(st.foes);else S.run.combat=null}
if(S&&S.run&&S.run.combat&&!S.run.combat.cid)S.run.combat.cid=Math.random().toString(36).slice(2);
if(S&&S.run&&S.run.combat&&!S.run.combat.over&&S.run.combat.turn!=='hero'){S.run.combat.acting=null;runTurns()}
render();updateAppIcon();

</script>
</body>
</html>
