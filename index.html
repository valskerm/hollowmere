<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollowmere: a solo valley adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3e8d8;--surface:#f3f5ec;--sunk:#d5dcc7;--ink:#21302a;--muted:#56665d;--line:#b5c0a8;
  --lantern:#8f5c0d;--lantern-soft:#eedcb2;--blight:#65558f;--danger:#9a3226;--good:#3a6935;
  --serif:'Alegreya',Georgia,'Times New Roman',serif;
  --sans:'Alegreya Sans','Gill Sans','Trebuchet MS',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#151e1b;--surface:#1e2a26;--sunk:#111916;--ink:#ebe8d8;--muted:#a2ae9f;--line:#33443d;
    --lantern:#e3ad4d;--lantern-soft:#3a3120;--blight:#a898da;--danger:#e8877a;--good:#93c582;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#151e1b;--surface:#1e2a26;--sunk:#111916;--ink:#ebe8d8;--muted:#a2ae9f;--line:#33443d;
    --lantern:#e3ad4d;--lantern-soft:#3a3120;--blight:#a898da;--danger:#e8877a;--good:#93c582;color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-weight:800;font-size:2.3rem;line-height:1;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800;margin:30px 0 8px}
h3{font-size:1.1rem;font-weight:600;margin:0}
p{margin:.4rem 0}
.meta{font-family:var(--sans);font-size:.9rem;color:var(--muted)}
.lede{font-size:1.2rem;max-width:34em}

/* header */
header.top{padding:18px 0 4px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{margin:.3rem 0 0;font-style:italic;color:var(--muted)}
.clock{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:.82rem;color:var(--muted);text-align:right;line-height:1.2}
.dayband{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:14px;font-family:var(--sans);font-size:.85rem}
.seg{padding:6px 9px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.seg.open{background:var(--lantern-soft);color:var(--ink)}
.seg b{display:block;font-weight:700}
.res{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;font-family:var(--sans);font-size:.95rem}
.res b{font-weight:700}
.herobar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:10px;font-family:var(--sans);font-size:.9rem}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lantern)}
.bar.hp>i{background:var(--good)}
.bar.foehp>i{background:var(--danger)}
.sleep{margin-top:12px;width:100%}

/* notes */
.note{margin:16px 0 0;padding:12px 14px;border-left:4px solid var(--lantern);background:var(--surface);border-radius:0 8px 8px 0}
.note .actions{margin-top:6px}

/* buttons */
.btn{font-family:var(--sans);font-size:.95rem;font-weight:700;border:1px solid var(--lantern);background:var(--lantern);
  color:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.88rem}
.btn.big{font-size:1.1rem;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blight);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ledger lists */
.ledger{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ledger>li{padding:14px 0;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--sans);font-size:.8rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.done{border-color:var(--good);color:var(--good)}
.tag.prog{border-color:var(--lantern);color:var(--lantern)}
.tag.lock{border-style:dashed}
.focusbox{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.focusbox .bar{height:12px;margin:8px 0 2px}
.checklist{list-style:none;padding:0;margin:6px 0 0;font-family:var(--sans)}
.checklist li::before{content:"○ ";color:var(--muted)}
.checklist li.ok::before{content:"● ";color:var(--good)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:34px}

/* farm */
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.plot{border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--surface);min-height:118px;display:flex;flex-direction:column;gap:6px}
.plot.growing{border-style:solid}
.plot.ready{border:2px solid var(--good)}
.plot .actions{margin-top:auto}

/* folk */
.hearts{color:var(--line);letter-spacing:1px;font-size:.95rem}
.hearts i{font-style:normal;color:var(--lantern)}
.say{font-style:italic;margin:6px 0 0}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:130px;background:none;border:0;padding:10px 2px 12px;font-family:var(--sans);
  font-size:.92rem;color:var(--muted);border-top:3px solid transparent;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);border-top-color:var(--lantern);font-weight:700}

/* create */
.create{padding-top:40px}
.create h1{font-size:clamp(2.8rem,10vw,4.6rem)}
.field{display:block;margin:24px 0 8px;font-family:var(--sans);font-weight:700}
.field input{display:block;width:100%;max-width:340px;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--serif);font-weight:400;font-size:1.1rem}
fieldset{border:0;padding:0;margin:20px 0}
legend{font-family:var(--sans);font-weight:700;margin-bottom:8px}
.cls{display:block;cursor:pointer;margin-bottom:8px}
.cls input{position:absolute;opacity:0}
.cls span{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cls input:checked+span{border:2px solid var(--lantern);padding:11px 13px}
.cls input:focus-visible+span{outline:3px solid var(--blight);outline-offset:2px}
.cls em{display:block;font-style:normal;color:var(--muted)}

/* battle map */
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;max-width:440px;margin:22px auto 12px;background:var(--line);border:2px solid var(--line);border-radius:6px}
.cell{aspect-ratio:1;background:var(--surface);border:0;padding:0;display:grid;place-items:center;min-width:0}
.cell.reach{background:var(--lantern-soft);cursor:pointer}
.cell.rock{background:var(--sunk)}
.rockshape{width:72%;height:58%;border-radius:45% 50% 38% 52%;background:var(--muted);opacity:.6}
.tok{width:80%;aspect-ratio:1;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-weight:700;font-size:clamp(.7rem,3.2vw,.95rem);line-height:1}
.tok.hero{background:var(--lantern);color:var(--surface);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--lantern)}
.tok.enemy{background:conic-gradient(var(--danger) var(--hp),var(--sunk) 0);padding:3px;cursor:pointer}
.tok.enemy b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--danger);color:var(--surface)}
.tok.enemy.target{box-shadow:0 0 0 3px var(--blight)}
.turnline{font-family:var(--sans);margin-top:4px}
.foelist{margin-top:4px}
.foe{padding:7px 12px}
ol.clog{list-style:none}
.clog li.head{font-weight:700;color:var(--ink);padding-top:12px}
/* rules UI */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px}
.formgrid .field select{display:block;width:100%;margin-top:6px;font-weight:400}
.abilgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.abilgrid label,.abilgrid>div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--sans)}
.abilgrid span{font-size:.85rem;color:var(--muted)}
.abilgrid b{font-size:1.05rem}
.abilgrid.sheet b{font-size:1.5rem;font-family:var(--serif)}
.abilgrid small{font-size:.78rem;color:var(--muted)}
.skills li{padding:7px 0}
.toggle{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-family:var(--sans);font-size:.95rem}
.toggle input{margin-top:4px;width:18px;height:18px;flex:none}
.initrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-family:var(--sans);font-size:.85rem}
.chip{padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.me{color:var(--ink)}
.chip.now{border-color:var(--lantern);background:var(--lantern-soft);color:var(--ink);font-weight:700}
.chip.gone{text-decoration:line-through;opacity:.5}
.cell.aim{background:var(--lantern-soft);cursor:crosshair;box-shadow:inset 0 0 0 2px var(--lantern)}
.tok.prone{transform:scaleY(.62)}
.tok.turned{opacity:.55}
details.group{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
details.group summary{font-family:var(--sans);font-weight:700;cursor:pointer;padding:4px 0}
.dying{margin-top:10px;padding:12px 14px;border-left:4px solid var(--danger);background:var(--surface);border-radius:0 8px 8px 0}
/* avatars */
.avatar{display:inline-grid;place-items:center;border-radius:50%;background:var(--lantern) center/cover no-repeat;color:var(--surface);font-family:var(--sans);font-weight:700;flex:none}
.avatar.big{width:84px;height:84px;font-size:2rem;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--lantern)}
.avatar.small{width:26px;height:26px;font-size:.8rem;margin-right:8px;vertical-align:middle}
.who{display:inline-flex;align-items:center}
.avatarpick{display:flex;gap:16px;align-items:center;margin-top:22px}
.avatarpick .field{margin:0}
.sheethead{margin-top:26px}
.tok.hero.img{background-size:cover;background-position:center;color:transparent}
/* combat feedback */
.cell{position:relative}
.tok{transition:filter .2s}
.tok.enemy.acting{box-shadow:0 0 0 3px var(--lantern)}
.tok.fx-hit{animation:hitglow .75s ease-out}
.tok.fx-heal{animation:healglow .75s ease-out}
.tok.dying{animation:hitglow .7s ease-out,fadeaway .45s .6s ease-in forwards}
@keyframes hitglow{0%{box-shadow:0 0 0 0 rgba(235,64,52,0)}20%{box-shadow:0 0 0 5px rgba(235,64,52,.95),0 0 22px 10px rgba(235,64,52,.7);filter:brightness(1.35) saturate(1.3)}100%{box-shadow:0 0 0 0 rgba(235,64,52,0)}}
@keyframes healglow{0%{box-shadow:0 0 0 0 rgba(110,200,110,0)}20%{box-shadow:0 0 0 5px rgba(110,200,110,.9),0 0 22px 10px rgba(110,200,110,.6)}100%{box-shadow:0 0 0 0 rgba(110,200,110,0)}}
@keyframes fadeaway{to{opacity:0;transform:scale(.5)}}
.pop{position:absolute;left:50%;top:-4px;transform:translate(-50%,0);font-family:var(--sans);font-weight:800;font-size:clamp(.85rem,3.8vw,1.05rem);line-height:1;
  padding:3px 7px;border-radius:99px;background:rgba(14,18,16,.88);pointer-events:none;z-index:4;white-space:nowrap;animation:popup 1.2s ease-out forwards}
.pop.hit{color:#ff5a4a}.pop.heal{color:#7fd17a}.pop.miss{color:#d9d6c8}.pop.block{color:#a9b8ff}
@keyframes popup{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px)}}
.waiting{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pop{animation:popfade 1.15s linear forwards}@keyframes popfade{0%,70%{opacity:1}100%{opacity:0}}}
/* town map */
:root{--m-grass:#b8c89a;--m-hill:#a4b58a;--m-water:#8db3c7;--m-road:#dccba4;--m-wall:#efe6d0;--m-roof:#a3533a;--m-roof2:#5d6f8c;--m-barn:#b0603f;--m-wood:#8a6440;--m-stone:#a5a298;--m-tree:#5c7b49;--m-tree2:#4b683c;--m-soil:#8a6a49;--m-sprout:#4f8a3c;--m-ripe:#d9a63a;--m-line:#3a3a30;--m-sign:#d9a63a;--m-cave:#2b2a26;--m-person:#e3ad4d;--m-kobold:#b46a3c;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-grass:#2a392b;--m-hill:#334430;--m-water:#2c4b5b;--m-road:#4b4535;--m-wall:#cbbd9c;--m-roof:#8d4731;--m-roof2:#4c5d78;--m-barn:#86452e;--m-wood:#8a6644;--m-stone:#77746b;--m-tree:#3d5a33;--m-tree2:#304a29;--m-soil:#4d3b29;--m-sprout:#6aa356;--m-ripe:#e0b04b;--m-line:#141a16;--m-sign:#e0b04b;--m-cave:#0d0f0d;--m-person:#e3ad4d;--m-kobold:#c47a48;}}
:root[data-theme="dark"]{--m-grass:#2a392b;--m-hill:#334430;--m-water:#2c4b5b;--m-road:#4b4535;--m-wall:#cbbd9c;--m-roof:#8d4731;--m-roof2:#4c5d78;--m-barn:#86452e;--m-wood:#8a6644;--m-stone:#77746b;--m-tree:#3d5a33;--m-tree2:#304a29;--m-soil:#4d3b29;--m-sprout:#6aa356;--m-ripe:#e0b04b;--m-line:#141a16;--m-sign:#e0b04b;--m-cave:#0d0f0d;--m-person:#e3ad4d;--m-kobold:#c47a48;}
.townmap{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--m-grass);max-width:560px;margin:8px auto 0}
.townmap svg{display:block;width:100%;height:auto}
.mlabel{font-family:var(--sans);font-size:10.5px;font-weight:700;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--m-grass);stroke-width:3px;stroke-linejoin:round}
.mlabel.faint{font-weight:500;opacity:.7}
.plot{cursor:pointer;outline:none}
.plotring{fill:transparent;stroke:transparent;stroke-width:2}
.plot:hover .plotring,.plot:focus-visible .plotring{stroke:var(--blight);stroke-dasharray:4 3}
.plot.sel .plotring{fill:var(--lantern);fill-opacity:.18;stroke:var(--lantern)}
.smoke circle{fill:var(--m-stone);opacity:.5}
@media (prefers-reduced-motion:no-preference){.smoke{animation:drift 3.5s ease-in-out infinite}@keyframes drift{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-3px);opacity:.5}}}
.lvlrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
.split{display:inline-flex;align-items:center;gap:10px}
.split b{min-width:1.2em;text-align:center;font-family:var(--sans)}
.pickrow{margin-top:10px;padding:10px 12px;border:2px solid var(--lantern);border-radius:10px;background:var(--surface)}
.plotpanel{margin-top:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:56px}
/* act 2 bits */
.guardian{width:62%;aspect-ratio:1;border-radius:6px;background:var(--lantern-soft);box-shadow:0 0 0 2px var(--lantern),0 0 14px 4px var(--lantern);opacity:.85}
.forgeglow{fill:#ff8a3c}
@media (prefers-reduced-motion:no-preference){.forgeglow{animation:glow 1.6s ease-in-out infinite}@keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}}
.raidbox{margin:18px 0 0;padding:12px 14px;border-left:4px solid var(--danger);background:var(--surface);border-radius:0 8px 8px 0}
/* adventure overlay */
.adv{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.adv-inner{max-width:680px;margin:0 auto;padding:24px 18px 48px}
.adv h1{font-size:1.9rem}
.prose{font-size:1.15rem;line-height:1.65}
.rollline{font-family:var(--sans);font-size:.92rem;color:var(--muted)}
.foe{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:8px;background:var(--surface);cursor:pointer;width:100%;text-align:left}
.foe.target{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.foe.dead{opacity:.4;cursor:default}
.foe .bar{grid-column:1/-1}
.clog{font-family:var(--sans);font-size:.92rem;list-style:none;padding:0;margin:18px 0 0;border-top:1px solid var(--line)}
.clog li{padding:7px 0;border-bottom:1px solid var(--line)}
.clog li.good{color:var(--good)}
.clog li.bad{color:var(--danger)}
.clog li.info{color:var(--muted)}
.result-list{font-family:var(--sans)}
.journal li{font-family:var(--sans);font-size:.93rem}
.journal li span{color:var(--muted)}
@media (max-width:420px){h1{font-size:2rem}.dayband{font-size:.8rem}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="avatarfile" accept="image/*" hidden>
<script>
"use strict";
/* ================= DATA ================= */
const SAVE_KEY='hollowmere-save-v1';
const SEASONS=['Spring','Summer','Fall','Winter'];
const WEEKDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const XP_AT=[0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000,999999];
const MAX_LEVEL=10;
const maxLevel=()=>S&&S.flags&&S.flags.sequel?14:MAX_LEVEL;
const ABIL=['str','dex','con','int','wis','cha'];
const ABIL_NAME={str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const ABIL_SHORT={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const SKILLS={acrobatics:['Acrobatics','dex'],animal:['Animal Handling','wis'],arcana:['Arcana','int'],athletics:['Athletics','str'],
  deception:['Deception','cha'],history:['History','int'],insight:['Insight','wis'],intimidation:['Intimidation','cha'],
  investigation:['Investigation','int'],medicine:['Medicine','wis'],nature:['Nature','int'],perception:['Perception','wis'],
  performance:['Performance','cha'],persuasion:['Persuasion','cha'],religion:['Religion','int'],sleight:['Sleight of Hand','dex'],
  stealth:['Stealth','dex'],survival:['Survival','wis']};
const SKILL=Object.fromEntries(Object.entries(SKILLS).map(([k,v])=>[k,v[0]]));
const STANDARD=[15,14,13,12,10,8];
const HALF=[[],[2],[2],[3],[3],[4,2],[4,2],[4,3],[4,3],[4,3,2],[4,3,2],[4,3,3],[4,3,3],[4,3,3,1],[4,3,3,1],[4,3,3,2],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2]];
const SLOTS=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];

const WEAPONS={
  unarmed:{name:'Unarmed strike',kind:'melee',dmg:'1d4',abil:'finesse',monk:true,type:'bludgeoning',verb:'strike'},
  spear:{name:'Spear',kind:'melee',dmg:'1d6',abil:'finesse',monk:true,type:'piercing',verb:'thrust your spear at'},

/* ================= ENGINE ================= */
let S=null;
const $=s=>document.querySelector(s);
const d=n=>1+Math.floor(Math.random()*n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function roll(expr){
  const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr);
  if(!m)return{total:+expr,rolls:[],expr};
  let t=0;const r=[];
  for(let i=0;i<+m[1];i++){const x=d(+m[2]);r.push(x);t+=x}
  t+=+(m[3]||0);return{total:t,rolls:r,expr};
}
const rtxt=r=>`${r.expr} [${r.rolls.join(', ')}]`;
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);if(t){const o=JSON.parse(t);if(o&&(o.v===1||o.v===2))return o}}catch(e){}return null}
function addLog(text,kind){S.log.unshift({day:S.day,text,kind:kind||''});if(S.log.length>250)S.log.length=250}
function note(text){S.flags.note=S.flags.note?S.flags.note+'\n\n'+text:text}
function commit(){checkAct();save();render()}

}

const housingCap=()=>3+(built('well')?3:0)+(lvl('well')>=2?3:0)+(lvl('well')>=3?4:0)+(lvl('flagon')>=2?2:0)+(lvl('flagon')>=3?2:0)+(S.flags&&typeof townRank==='function'&&['Town','Valley seat'].includes(townRank().name)?2:0);
const housed=()=>S.workers.filter(w=>w.kind!=='kobold').length;
const hasPerk=id=>Object.values(S.npcs).some(n=>n.perks.includes(id));
const potionPrice=()=>hasPerk('ilsa3')?15:20;
const wageFor=()=>hasPerk('bram3')?4:5;
function canAfford(cost){return Object.entries(cost).every(([k,v])=>S.res[k]>=v)}
function costText(cost){return Object.entries(cost).map(([k,v])=>`${v} ${k==='gold'?'gp':k}`).join(', ')}

/* ---- building ---- */
function startBuild(k){
  const b=BUILDINGS[k],st=S.buildings[k];
  if(st.status!=='none'||buildingLock(k)||!canAfford(b.cost))return;
  for(const [r,v] of Object.entries(b.cost))S.res[r]-=v;
  st.status='building';if(!S.focus)S.focus=k;
  addLog(`Started building ${b.name}.`);commit();
}
function addBP(n){
  if(!S.focus)return 0;
  const k=S.focus,st=S.buildings[k];
  if(upgrading(k)){const u=nextUp(k);st.upBp+=n;if(st.upBp>=u.bp){delete st.upBp;st.lvl=(st.lvl||1)+1;const pr=st.lvl>=3?4:2;S.prosperity+=pr;
    if(k==='farmstead')while(S.plots.length<(st.lvl>=3?8:6))S.plots.push({crop:null,days:0,watered:false});
    S.focus=nextFocus();addLog(`${u.name} is finished. +${pr} Prosperity.`,'good');note(`${u.name} is finished. ${u.benefit}`)}return n}
  st.bp+=n;
  if(st.bp>=BUILDINGS[k].bp)completeBuilding(k);
  return n;
}
function completeBuilding(k){
  const b=BUILDINGS[k],st=S.buildings[k];
  st.status='done';st.bp=b.bp;S.prosperity+=b.prosp;
  if(k==='farmstead')while(S.plots.length<4)S.plots.push({crop:null,days:0,watered:false});
  S.focus=nextFocus();
  addLog(`${b.name} is finished. +${b.prosp} Prosperity.`,'good');
  note(`${b.name} is finished. ${b.benefit}`);
}

/* ---- chores ---- */
function doChore(k){
  if(S.used.morning||S.run)return;
  let msg='';
  if(k==='salvageTimber'){if(!S.salvage.timber)return;const n=Math.min(d(6),S.salvage.timber);S.salvage.timber-=n;S.res.timber+=n;msg=`You salvage ${n} timber from the ruins.`}
  else if(k==='salvageStone'){if(!S.salvage.stone)return;const n=Math.min(d(4),S.salvage.stone);S.salvage.stone-=n;S.res.stone+=n;msg=`You pry loose ${n} stone.`}
  else if(k==='chop'){if(!built('lumber'))return;const n=d(6)+2;S.res.timber+=n;msg=`You chop ${n} timber.`}
  else if(k==='cut'){if(!built('quarry'))return;const n=d(4)+2;S.res.stone+=n;msg=`You cut ${n} stone.`}
  else if(k==='build'){if(!S.focus)return;const name=focusName();addBP(1);msg=`You put in a morning’s work on ${name}.`}
  S.used.morning=true;addLog(msg);commit();
}
function labor(){
  if(S.used.day||S.run||!S.focus)return;
  const name=focusName();addBP(2);S.used.day=true;
  addLog(`You spend the whole day building ${name}. +2 build points.`);commit();
}

/* ---- workers ---- */
function candidates(){
  if(!S.candidates||S.candidates.day!==S.day){
    const list=[];for(let i=0;i<2;i++)list.push({name:pick(WORKER_NAMES),die:d(5)===1?6:4});
    S.candidates={day:S.day,list};
  }
  return S.candidates.list;
}
function hire(i){
  const c=candidates()[i],wage=wageFor();
  if(!c||!built('flagon')||housed()>=housingCap()||S.res.gold<wage)return;
  S.res.gold-=wage;
  S.workers.push({id:S.nextId++,name:c.name,kind:'human',die:c.die,wage,assign:'build',days:0});
  S.candidates.list.splice(i,1);
  addLog(`You hire ${c.name} and pay the first week (${wage} gp).`);commit();
}

/* ---- farm ---- */
function plant(i,crop){
  const p=S.plots[i];if(!p||p.crop)return;
  if(crop==='moon'){if(S.inv.moonseed<1)return;S.inv.moonseed--}
  else{if(S.res.gold<CROPS[crop].seed)return;S.res.gold-=CROPS[crop].seed}
  Object.assign(p,{crop,days:0,watered:false});commit();
}
function harvest(i){
  const p=S.plots[i];if(!p||!p.crop||p.days<CROPS[p.crop].grow)return;
  S.inv[p.crop]++;addLog(`Harvested ${CROPS[p.crop].name.toLowerCase()}.`);
  Object.assign(p,{crop:null,days:0,watered:false});commit();
}
function water(){
  if(S.used.water)return;
  S.plots.forEach(p=>{if(p.crop)p.watered=true});S.used.water=true;commit();
}

/* ---- folk ---- */
function gainHearts(id,n){
  const st=S.npcs[id];st.hearts=Math.min(10,st.hearts+n);
  for(const pk of NPCS[id].perks){
    if(st.hearts>=pk.at&&!st.perks.includes(pk.id)){
      st.perks.push(pk.id);
      if(pk.id==='maren3')S.prosperity+=1;
      if(pk.id==='maren6')S.blight=Math.max(0,S.blight-1);
      if(pk.id==='ilsa5')S.inv.moonseed+=2;
      addLog(`${NPCS[id].name}: ${pk.text}`,'good');note(`${NPCS[id].name} warms to you. ${pk.text}`);
    }
  }
}
function npcHere(id){return !NPCS[id].saturday||dateInfo(S.day).dow===5||built('market')}
function talk(id){
  const st=S.npcs[id];if(st.talked||!npcHere(id))return;
  const L=NPCS[id].lines;st.line=L[Math.min(L.length-1,Math.floor(st.hearts/3))];
  st.talked=true;gainHearts(id,1);commit();
}
function gift(id,item){
  const st=S.npcs[id];if(st.gifted||!npcHere(id)||S.inv[item]<1)return;
  S.inv[item]--;st.gifted=true;const liked=NPCS[id].likes===item;
  gainHearts(id,liked?2:1);st.line=liked?'Oh, my favorite. You remembered.':'That’s kind of you. Thank you.';commit();
}
const SHOP_LIMITS={ilsa:3,chapel:2};
function weeklyStock(){const w=Math.floor((S.day-1)/7);if(!S.stock||S.stock.week!==w)S.stock={week:w,...SHOP_LIMITS,chapel:SHOP_LIMITS.chapel+(lvl('chapel')>=2?2:0),superior:lvl('chapel')>=3?1:0};return S.stock}
const CONSUMABLE_QTY={potion:2,moonseed:3,greater:2,superior:1,heroism:1};
function peddlerStock(){
  if(dateInfo(S.day).dow!==5&&!built('market'))return null;
  if(!S.peddler||S.peddler.day!==S.day){
    const pool=PEDDLER_GOODS.filter(g=>!g.gear||!S.hero.owned.includes(g.id));
    const items=[];while(items.length<3&&pool.length){items.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].id)}
    S.peddler={day:S.day,items,sold:[],qty:Object.fromEntries(items.map(id=>[id,CONSUMABLE_QTY[id]||1]))};
  }
  return S.peddler;
}
const peddlePrice=g=>hasPerk('corwin3')?Math.round(g.price*.9):g.price;
function buyPeddler(id){
  const st=peddlerStock(),g=PEDDLER_GOODS.find(x=>x.id===id);
  if(!st||!g||st.sold.includes(id)||S.res.gold<peddlePrice(g))return;
  st.qty=st.qty||{};if(st.qty[id]===undefined)st.qty[id]=CONSUMABLE_QTY[id]||1;
  S.res.gold-=peddlePrice(g);
  if(g.gear){S.hero.gear[g.gear]++;S.hero.owned.push(g.id)}
  else S.inv[id]++;
  if(--st.qty[id]<=0)st.sold.push(id);
  addLog(`Bought ${g.name.toLowerCase()} from Corwin.`);commit();
}

/* ---- the night ---- */
function sleep(){
  if(S.run)return;
  const lines=[];
  if(S.raid&&S.raid.arrive<=S.day)resolveRaidUndefended(lines);
  const builders=S.workers.filter(w=>w.assign==='build').length+(hasPerk('dorrin3')&&S.focus?1:0);
  if(S.focus&&builders){const name=focusName();addBP(builders);lines.push(`Your crew added ${builders} build point${builders>1?'s':''} to ${name}.`)}
  const rained=S.weather==='rain';
  S.plots.forEach(p=>{if(p.crop&&(p.watered||rained||lvl('well')>=3)&&p.days<CROPS[p.crop].grow)p.days=Math.min(CROPS[p.crop].grow,p.days+(S.flags.ending==='bloom'?2:1));p.watered=false});
  let earned=0;for(const k in S.bin){earned+=S.bin[k]*(CROPS[k].sell+(built('market')?1:0)+(lvl('farmstead')>=3?1:0));S.bin[k]=0}
  if(earned){S.res.gold+=earned;lines.push(`The shipping bin paid ${earned} gp.`)}
  longRest(S.hero);
  S.workers.forEach(w=>w.days++);
  S.day++;S.used={morning:false,day:false,water:false};
  for(const k in S.npcs){S.npcs[k].talked=false;S.npcs[k].gifted=false;S.npcs[k].line=null}
  const di=dateInfo(S.day);
  if(di.dow===0)weekRollover(lines);
  if(di.sday===1)seasonRollover(lines);
  S.weather=d(5)===1?'rain':'clear';
  if(S.weather==='rain')lines.push('It’s raining. Your crops are watered for you.');
  dailyEvent(lines);
  if(S.flags.bruised){S.flags.bruised--;S.used.morning=true;lines.push('You’re still recovering. No morning chore today.')}
  if(S.hero.level>=5&&!S.flags.mystic){S.flags.mystic=S.day;lines.push('A woman in a moth-grey cloak has taken a room at the Flagon. She calls herself Sable, a mystic, and says she has come for you. Find her on the Folk tab.')}
  merchantTick(lines);
  raidTick(lines);
  if(di.dow===5&&!built('market'))lines.push('Corwin’s cart is in the square. It’s market day.');
  addLog(`A new day: ${di.season} ${di.sday}.`,'info');
  lines.forEach(l=>addLog(l));
  S.flags.note=lines.length?lines.join('\n\n'):null;
  window.scrollTo(0,0);commit();
}
function weekRollover(lines){
  S.bounties=genBounties();lines.push('New bounties are posted on the notice board.');
  for(const w of S.workers){
    if(w.assign==='salvage'){const r=S.res.timber<=S.res.stone&&S.salvage.timber>0||!S.salvage.stone?'timber':'stone',n=Math.min(S.salvage[r],d(w.die)+(w.kind==='kobold'?1:0));
      if(n>0){S.salvage[r]-=n;S.res[r]+=n;lines.push(`${w.name} scavenged ${n} ${r} from the ruins.`)}else{w.assign='build';lines.push(`The ruins are picked clean. ${w.name} goes back to construction.`)}}
    if(w.assign==='lumber'&&built('lumber')){const n=d(w.die)+(lvl('lumber')>=2?2:0)+(lvl('lumber')>=3?3:0);S.res.timber+=n;lines.push(`${w.name} cut ${n} timber this week.`)}
    if(w.assign==='quarry'&&built('quarry')){const n=d(w.die)+(w.kind==='kobold'?1:0)+(lvl('quarry')>=2?2:0)+(lvl('quarry')>=3?3:0);S.res.stone+=n;lines.push(`${w.name} cut ${n} stone this week.`)}
    if(w.assign==='mine'&&S.flags.warren&&S.flags.ending!=='reseal'){const r=d(w.die)+(w.kind==='kobold'?1:0);if(r>=4){S.res.moonsilver++;lines.push(`${w.name} dug up a lump of moonsilver.`)}else lines.push(`${w.name} found no moonsilver this week.`)}
  }
  if(built('flagon')){if(S.flags.flagonShut&&S.day<S.flags.flagonShut)lines.push('The Flagon stayed shut this week.');else{const inc=5+(hasPerk('bram3')?3:0)+(hasPerk('bram6')?5:0)+(lvl('flagon')>=2?8:0)+(lvl('flagon')>=3?15:0);S.res.gold+=inc;lines.push(`The Flagon took in ${inc} gp.`)}}
  if(typeof townRank==='function'&&townRank().name==='Valley seat'){S.res.gold+=25;lines.push('Tithes from the valley farms: 25 gp.')}
  if(built('market')){const m=5+(lvl('market')>=2?10:0)+(lvl('market')>=3?20:0);S.res.gold+=m;lines.push(`Market stall rents: ${m} gp.`)}
  const leaving=[];let paid=0;
  for(const w of S.workers){
    let wage=w.wage;
    if(S.res.food>0)S.res.food--;else wage+=2;
    if(S.res.gold>=wage){S.res.gold-=wage;paid+=wage}else leaving.push(w);
  }
  if(paid)lines.push(`Payday: ${paid} gp in wages.`);
  if(leaving.length){S.workers=S.workers.filter(w=>!leaving.includes(w));lines.push(`${leaving.map(w=>w.name).join(' and ')} left. You couldn’t pay them.`)}
}
function seasonRollover(lines){
  for(const w of S.workers){if(w.days>=28&&w.die<8){w.die+=2;w.days=0;lines.push(`${w.name} has grown skilled: now rolls a d${w.die}.`)}}
  const adv=S.flags.act3?0:!S.quests.seal?2:(S.flags.act1?1:0);
  if(adv){
    S.blight+=adv;lines.push(`The season turns, and the blight spreads. The Blight Clock advances by ${adv}.`);
    blightRaid(lines);
  }
}
function blightRaid(lines){
  if(S.blight<8)return;
  const keep=built('watchtower')?.75:.5;
  S.res.gold=Math.floor(S.res.gold*keep);S.res.timber=Math.floor(S.res.timber*keep);S.res.stone=Math.floor(S.res.stone*keep);
  S.blight=4;lines.push(`The blight boils over. Grey things raid the town, and ${keep===.5?'half':'a quarter'} of your stores are lost.${keep>.5?' The watchtower’s warning saved the rest.':''}`);
}
function dailyEvent(lines){
  const r=d(20);
  if(r>=12&&r<=14){const n=d(4);S.res.gold+=n;lines.push(`You find ${n} gp in the road.`)}
  else if(r===15||r===16){S.res.food+=2;lines.push('Ilsa leaves a basket on your step: +2 food.')}
  else if(r===17){const n=Math.min(S.res.timber,d(4));S.res.timber-=n;S.weather='rain';lines.push(`A storm in the night${n?` ruins ${n} timber`:''}. At least the crops got water.`)}
  else if(r===18){const n=d(4);S.res.stone+=n;lines.push(`A cart tipped on the hill road. You haul off ${n} stone.`)}
  else if(r===19&&!S.quests.seal){const g=S.plots.filter(p=>p.crop&&p.days>0);if(g.length){pick(g).days--;lines.push('Grey frost on the fields. One crop lost a day of growth.')}}
  else if(r===20){const k=pick(Object.keys(NPCS).filter(k=>!NPCS[k].saturday));gainHearts(k,1);lines.push(`${NPCS[k].name} saw you working late and thinks well of you.`)}
}
function act1Ready(){return S.quests.seal&&builtCount()>=4&&S.prosperity>=10&&S.hero.level>=3}
function checkAct(){if(!S.flags.act1&&act1Ready()){S.flags.act1=true;S.flags.actModal=true;addLog('Hollowmere is a hamlet again.','good')}}

/* ---- adventures ---- */
function makePatrol(){
  const L=S.hero.level;
  const opts=L<2?[['rat','rat'],['wolf'],['kobold','rat'],['bandit']]:L<3?[['wolf','wolf'],['kobold','kobold'],['blightrat','rat'],['bandit','bandit']]:L<5?[['madwolf'],['wolf','wolf','rat'],['blightspawn','blightspawn'],['bandit','bandit','kobold'],['ghoul']]:L<6?[['ghoul','blightspawn'],['thug','thug'],['spider'],['wolf','wolf','madwolf'],['blightkobold','blightkobold','kobold']]:L<7?[['ghoul','ghoul'],['thug','thug','bandit'],['spider','spider'],['madwolf','madwolf','wolf']]:L<9?[['wight'],['ghoul','ghoul','ghoul'],['ogrezombie'],['needleblight','needleblight','vineblight'],['skeleton','skeleton','skeleton']]:L<11?[['wight','wight'],['ogrezombie','ghoul'],['vineblight','vineblight','needleblight'],['wight','skeleton','skeleton']]:L<13?[['winterwolf','winterwolf'],['yeti','ghast'],['frostgiant'],['wraith']]:[['frostgiant'],['wraith','ghast'],['youngblack'],['troll','ghast']];
  if(d(6)===1)return{name:'Valley patrol',reward:{gold:d(6)+4,xp:25},done:'A quiet day. The valley feels a little safer.',stages:[{t:'text',text:pick(PATROL_INTROS)+' No trouble, but you find a forgotten satchel with a few coins inside.'}]};
  return{name:'Valley patrol',reward:{gold:d(6)+2+(L>=5?d(10)+5:0),xp:0},done:'You head home as the sun sets. The valley feels a little safer.',stages:[{t:'text',text:pick(PATROL_INTROS)},{t:'fight',foes:pick(opts),text:'Trouble finds you.'}]};
}
function questAvailable(id){const q=QUESTS[id];if(S.quests[id])return false;if(q.needs&&!S.quests[q.needs])return false;if(q.req&&!q.req[0]())return false;return true}
function questLockText(id){const q=QUESTS[id];if(q.needs&&!S.quests[q.needs])return`Finish “${QUESTS[q.needs].name}” to learn more.`;if(q.req&&!q.req[0]())return q.req[1];return''}
function startRun(qid){
  if(S.used.day||S.run)return;
  if(qid!=='patrol'&&qid!=='raid'&&!qid.startsWith('bounty:')&&!questAvailable(qid))return;
  if(qid.startsWith('bounty:')&&!(S.bounties||[]).some(b=>'bounty:'+b.id===qid))return;
  S.used.day=true;
  if(qid==='raid'&&(!S.raid||S.raid.arrive>S.day))return;
  const bnty=qid.startsWith('bounty:')&&(S.bounties||[]).find(b=>'bounty:'+b.id===qid);
  S.run={qid:bnty?'bounty':qid,q:bnty?makeBounty(bnty):qid==='raid'?makeRaidQuest():qid==='patrol'?makePatrol():qid==='siege'?makeSiege():null,stage:0,rested:false,ambush:qid==='patrol'&&built('watchtower')&&d(2)===1,combat:null,pending:null,result:null};
  {const q=qdef();while(S.run.stage<q.stages.length&&q.stages[S.run.stage].if&&!COND[q.stages[S.run.stage].if]())S.run.stage++}
  enterStage();commit();
}
const qdef=()=>S.run.q||QUESTS[S.run.qid];
const curStage=()=>qdef().stages[S.run.stage];
function enterStage(){
  const st=curStage();if(!st){finishRun(true);return}
  if(st.set==='ambush')S.run.ambush=true;
  if(st.effect==='forge')S.flags.forge=true;
  if(st.effect==='warren'){S.flags.warren=true;if(S.flags.koboldsAllied){S.workers.push({id:S.nextId++,name:'Tikka',kind:'kobold',die:6,wage:3,assign:'mine',days:0});addLog('Tikka herself joins your miners.','good')}}
  if(st.effect==='bramHeals'){gainHearts('bram',2);S.flags.bramHealed=true}
  if(st.effect==='bramHurt'){S.npcs.bram.hearts=Math.max(0,S.npcs.bram.hearts-2);S.flags.flagonShut=S.day+7}
  if(st.effect==='mareinPeace'){gainHearts('maren',2)}
  if(st.effect==='shrineDone'){if(S.npcs.ilsa.hearts>=6){S.flags.ilsaTrust=true;gainHearts('ilsa',2);addLog('Ilsa trusts you completely now.','good')}}
  if(st.effect==='ysoldeYields')S.flags.ysoldeYields=true;
  if(st.effect==='endReseal'||st.effect==='endDestroy'||st.effect==='endBloom'){S.flags.ending=st.effect==='endReseal'?'reseal':st.effect==='endDestroy'?'destroy':'bloom';S.flags.act3=true;S.blight=0;
    if(S.flags.ending==='reseal')S.workers.forEach(w=>{if(w.assign==='mine')w.assign=built('quarry')?'quarry':'build'});addLog('The Sleeper’s story is over.','good')}
  if(st.effect==='frostSealed'){S.flags.frostSealed=true}
  if(st.effect==='takeShard'){S.flags.rimeShard=true;S.hero.items=S.hero.items||[];S.hero.items.push({id:'rimeshard',attuned:false});addLog('You took the rime shard.','bad')}
  if(st.effect==='ch2end'){S.flags.ch2=true;S.flags.ch2Modal=true}
  if(st.effect==='act2end'){S.flags.act2=true;S.flags.act2Modal=true;S.blight=Math.min(8,S.blight+3);addLog('The second seal is broken. The Blight Clock jumps by 3.','bad')}
  if(st.effect==='kobolds')S.flags.koboldsAllied=true;
  if(st.effect==='kobolds'){for(let i=0;i<2;i++)S.workers.push({id:S.nextId++,name:i?'Snik':'Tikka’s cousin Vreb',kind:'kobold',die:4,wage:3,assign:'build',days:0});addLog('Two kobold diggers join your workforce.','good')}
  if(st.t==='fight')startCombat(st.foes);
}
function nextStage(gotoId){
  const q=qdef();
  S.run.stage=gotoId?q.stages.findIndex(s=>s.id===gotoId):S.run.stage+1;
  while(S.run.stage>=0&&S.run.stage<q.stages.length&&q.stages[S.run.stage].if&&!COND[q.stages[S.run.stage].if]())S.run.stage++;
  if(S.run.stage<0||S.run.stage>=q.stages.length)finishRun(true);else enterStage();
}
/* ---- Act 2 ---- */
const COND={
  allied:()=>!!S.flags.koboldsAllied, notAllied:()=>!S.flags.koboldsAllied,
  corwin6:()=>S.npcs.corwin.hearts>=6
};
Object.assign(QUESTS,{
  delve:{act:2,name:'Into the dark',lvl:4,needs:'seal',req:[()=>!!S.flags.act1,'Hollowmere must become a hamlet first.'],
    blurb:'Past the cracked seal, the old Varne workings go down into the hill. Maren wants to know what the Order shut away.',
    reward:{gold:60,xp:1200,moonsilver:2},
    done:'You climb out with two lumps of ore that shine like frozen moonlight. Dorrin turns one over in his hands for a long time without speaking.',
    stages:[
      {t:'text',text:'Beyond the broken door, a timbered tunnel slopes down into the dark. Your lantern finds old rails, rusted picks, and grey threads of rot along the walls.'},
      {t:'fight',foes:['blightspawn','blightspawn','blightspawn'],text:'Shapes shamble out of a side gallery: miners, or what the rot left of them.'},

function normalize(st){
  for(const k of Object.keys(BUILDINGS))if(!st.buildings[k])st.buildings[k]={status:'none',bp:0};
  for(const k of Object.keys(QUESTS))if(st.quests[k]===undefined)st.quests[k]=false;
  st.res.moonsilver=st.res.moonsilver||0;st.inv.superior=st.inv.superior||0;st.inv.heroism=st.inv.heroism||0;
  if(st.hero&&!st.hero.items)st.hero.items=[];
  if(!st.bounties&&st.hero){const keep=S;S=st;st.bounties=genBounties();S=keep}
  if(!st.merchant)st.merchant={arrive:st.day+3+d(4),leave:0,stock:[],sold:[]};st.inv.greater=st.inv.greater||0;
  if(st.hero&&st.hero.gear&&st.hero.gear.atk===undefined)st.hero.gear.atk=0;
  if(st.flags.koboldsAllied===undefined&&st.workers.some(w=>w.kind==='kobold'))st.flags.koboldsAllied=true;
  return st;
}

function makeSiege(){
  const defs=[['watchtower','The watchtower’s horn sounds early: the first wave is broken before it reaches the fields.'],
              ['palisade','The palisade holds the hill road. A whole wave breaks against the stakes.'],
              ['chapel','The chapel bells ring, and one wave of the dead turns back from the holy sound.']];
  const held=defs.filter(([k])=>built(k));
  const waves=Math.max(1,4-held.length+(S.blight>=6?1:0));
  const L=S.hero.level,pool=L<9?[['blightspawn','blightspawn','ghoul'],['ghoul','ghoul'],['ogrezombie','blightspawn'],['wight','skeleton','skeleton'],['ghoul','ghoul','blightspawn']]
                          :[['ghoul','ghoul','ghoul'],['ogrezombie','ghoul'],['wight','wight'],['ogrezombie','ogrezombie'],['wight','ghoul','ghoul']];
  const stages=[{t:'text',text:`Night falls, and the hill road fills with grey shapes. ${held.length?held.map(x=>x[1]).join(' '):'Hollowmere has no walls, no tower and no bells. Every wave will reach the square.'} ${waves} wave${waves>1?'s':''} still come for the town.`}];
  for(let i=0;i<waves;i++){
    stages.push({t:'fight',foes:pool[i%pool.length],text:i===0?'The first wave reaches the square.':i===waves-1?'The last wave, the worst of them, comes out of the dark.':'Another wave comes down the hill.'});
    if(i<waves-1)stages.push({t:'text',text:'A lull. Bram passes you water; Ilsa binds a cut. Then the horns again.'});
  }
  return{name:'The long night',reward:QUESTS.siege.reward,done:QUESTS.siege.done,rests:Math.max(1,waves-2),stages};
}
function siegeDamage(lines){
  const pickable=Object.keys(BUILDINGS).filter(k=>built(k)&&!['well','palisade'].includes(k));
  if(!pickable.length)return;
  const k=pick(pickable),b=BUILDINGS[k];S.buildings[k]={status:'building',bp:Math.floor(b.bp/2)};S.prosperity-=b.prosp;
  if(!S.focus)S.focus=k;lines.push(`The dead broke through and wrecked ${b.name}. It needs rebuilding.`);
}

const ownsItem=id=>(S.hero.items||[]).some(i=>i.id===id);

const itemSum=(key,h=S.hero)=>activeItems(h).reduce((a,m)=>a+(m[key]||0),0);

/* ---- the traveling merchant ---- */
const merchantHere=()=>S.merchant&&S.day>=S.merchant.arrive&&S.day<=S.merchant.leave;
function merchantStock(size=5){
  const L=S.hero.level,pool=Object.keys(MAGIC).filter(id=>usable(id)&&(MAGIC[id].consumable||!ownsItem(id))&&(MAGIC[id].rarity==='uncommon'||L>=4));
  const out=[];while(out.length<size&&pool.length)out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if(!out.some(id=>MAGIC[id].consumable))out[out.length-1]='greater';
  return out;
}
function merchantTick(lines){
  if(!S.merchant)S.merchant={arrive:S.day+6+d(6),leave:0,stock:[],sold:[]};
  const m=S.merchant;
  if(S.day===m.arrive){m.leave=S.day+2;m.stock=merchantStock(lvl('market')>=3?7:5);m.sold=[];m.qty=Object.fromEntries(m.stock.map(id=>[id,CONSUMABLE_QTY[id]||1]));lines.push('A painted wagon rolls into the square, hung with bells and glass charms. Mirela the Wanderer is selling magic items for the next three days.')}
  if(m.leave&&S.day>m.leave){lines.push('Mirela’s wagon has moved on.');S.merchant={arrive:S.day+(lvl('market')>=2?5+d(4):8+d(8)),leave:0,stock:[],sold:[]}}
}
const mPrice=id=>Math.round(MAGIC[id].price*(hasPerk('corwin6')?.9:1));
function buyMagic(id){
  const m=S.merchant;if(!merchantHere()||!m.stock.includes(id)||m.sold.includes(id)||S.res.gold<mPrice(id))return;
  m.qty=m.qty||{};if(m.qty[id]===undefined)m.qty[id]=CONSUMABLE_QTY[id]||1;
  S.res.gold-=mPrice(id);if(--m.qty[id]<=0)m.sold.push(id);giveItem(id);addLog(`Bought ${MAGIC[id].name} from Mirela.`,'good');commit();
}
function sellMagic(i){
  const h=S.hero,it=h.items[i];if(!it||!merchantHere())return;
  const val=Math.floor(MAGIC[it.id].price/2);h.items.splice(i,1);S.res.gold+=val;addLog(`Sold ${MAGIC[it.id].name} to Mirela for ${val} gp.`);commit();
}

function raidTick(lines){

function raidDamage(deficit,lines){

function resolveRaidUndefended(lines){

function heroAC(){const h=S.hero,c=S.run&&S.run.combat,sh=shape(h);return Math.max(h.conds.barkskin?17:0,sh?Math.max(sh.ac,h.level>=3?13+am('wis'):0):baseAC(h))+(c&&c.shieldUp?5:0)+(h.conc==='shieldoffaith'?2:0)}
function maxHP(h){

function buildHero(o){

  const skills=[...B.skills];
  for(const s of C.skillPool){if(skills.length>=B.skills.length+C.skillCount)break;if(!skills.includes(s))skills.push(s)}
  if(o.species==='human'){const s=['perception','persuasion','insight','athletics'].find(x=>!skills.includes(x));skills.push(s)}
  if(o.species==='elf'){const s=['perception','survival','insight'].find(x=>!skills.includes(x));if(s)skills.push(s)}
  const feats=[B.feat];

  const expertise=[...(C.expertise||[])].filter(s=>skills.includes(s));

    avatar:o.avatar||null,gear:o.gear||{ac:0,dmg:0,check:0},owned:o.owned||[],temp:0,conds:{},conc:null,dying:null,mageArmor:false,asi:false,pools:{}};

}
function levelFeatures(h,l,silent){

  const asi=()=>{const k=CLASSES[h.cls].primary;if(h.abil[k]<=18)h.abil[k]+=2;else if(h.abil[k]===19){h.abil[k]=20;h.abil.con=Math.min(20,h.abil.con+1)}else h.abil.con=Math.min(20,h.abil.con+2)};
  if(l===4&&!h.asi){asi();h.asi=true}
  if(l===6&&h.cls==='fighter'&&!h.asi6){asi();h.asi6=true}
  if(l===8&&!h.asi8){asi();h.asi8=true}
  if(l===12&&!h.asi12){asi();h.asi12=true}
  if(l===14&&h.cls==='fighter'&&!h.asi14){asi();h.asi14=true}
  if(l===10&&h.cls==='rogue'&&!h.asi10){asi();h.asi10=true}
  if(h.cls==='ranger'&&l===2&&!h.expertise.includes('survival')){if(!h.skills.includes('survival'))h.skills.push('survival');h.expertise.push('survival')}

  if(h.cls==='bard'&&(l===2||l===9)){for(const s of h.skills.filter(x=>!h.expertise.includes(x)).slice(0,2))h.expertise.push(s)}
  if(l===6&&h.cls==='rogue'){for(const s of h.skills.filter(x=>!h.expertise.includes(x)).slice(0,2))h.expertise.push(s)}
}

/* ---- dice for the hero ---- */
function heroD20(adv,dis){
  const h=S.hero,notes=[];
  const r=()=>{let x=d(20);if(x===1&&h.species==='halfling'){x=d(20);notes.push('Luck rerolled a 1')}return x};
  const a=r();let nat=a,txt=`d20 [${a}]`;
  if(adv&&!dis){const b=r();nat=Math.max(a,b);txt=`d20 with advantage [${a}, ${b}]`}
  else if(dis&&!adv){const b=r();nat=Math.min(a,b);txt=`d20 with disadvantage [${a}, ${b}]`}
  return{nat,txt:txt+(notes.length?` (${notes.join(', ')})`:'')};
}
function rollCheck(spec){
  const h=S.hero;let adv=false,dis=false;
  if(spec.skill==='athletics'&&h.cls==='fighter'&&h.level>=3)adv=true;
  if(spec.save==='con'&&spec.vs==='poison'&&h.species==='dwarf')adv=true;
  if(h.conds.poisoned&&spec.skill)dis=true;
  const r=heroD20(adv,dis),m=spec.skill?skillMod(spec.skill):saveMod(spec.save);
  if(spec.skill&&h.cls==='rogue'&&h.level>=11&&h.skills.includes(spec.skill)&&r.nat<10){r.txt+=` (Reliable Talent: ${r.nat} counts as 10)`;r.nat=10}
  const label=spec.skill?SKILL[spec.skill]:`${ABIL_NAME[spec.save]} save`;
  return{nat:r.nat,mod:m,total:r.nat+m,label,txt:`${label}: ${r.txt} ${sgn(m)}`};
}
function checkText(res,dc){return`${res.txt}${res.bonus?` + ${res.bonus}`:''} = ${res.total} vs DC ${dc}`}

/* ---- quest checks with rerolls ---- */
function resolveCheck(spec,pass,fail){
  const res=rollCheck(spec);
  S.run.pending={spec,pass,fail,res,passed:res.total>=spec.dc,final:null};
  if(S.run.pending.passed)applyOutcome();
}
function applyOutcome(){
  const p=S.run.pending,o=p.passed?p.pass:p.fail,h=S.hero;let extra='';
  if(o.gold)S.res.gold+=o.gold;
  if(o.set==='ambush')S.run.ambush=true;else if(o.set==='thin')S.run.thin=true;else if(o.set)S.flags[o.set]=true;
  if(o.damage){let n=roll(o.damage).total;if(o.dtype==='poison'&&h.species==='dwarf'){n=Math.floor(n/2);extra+=' Your dwarven resilience halves it.'}
    h.hp=Math.max(1,h.hp-n);extra=` You take ${n} ${o.dtype||''} damage.`+extra}
  if(o.cond){h.conds[o.cond]=true;extra+=` You are ${o.cond}: disadvantage on attack rolls and ability checks until the quest ends.`}
  p.final={text:o.text+extra,goto:o.goto||null};
}
function rerollCheck(kind){
  const p=S.run.pending,h=S.hero;if(!p||p.passed||p.final)return;
  if(kind==='bi'&&h.pools.bi&&h.cls==='bard'){h.pools.bi--;const x=d(biDie());p.res.bonus=(p.res.bonus||0)+x;p.res.total+=x;p.biTried=true}
  else if(kind==='insp'&&h.pools.insp){h.pools.insp--;p.res=rollCheck(p.spec);p.res.txt+=' (Heroic Inspiration reroll)'}
  else if(kind==='luck'&&h.pools.luck){h.pools.luck--;const r2=rollCheck(p.spec);if(r2.total>p.res.total)p.res=r2;p.res.txt+=` (Lucky: second roll ${r2.nat})`}
  else if(kind==='tactical'&&h.pools.secondwind&&p.spec.skill&&h.cls==='fighter'&&h.level>=2){
    const b=d(10);p.res.bonus=(p.res.bonus||0)+b;p.res.total+=b;p.tacticalTried=true;
    if(p.res.total>=p.spec.dc)h.pools.secondwind--;
  }else return;
  p.passed=p.res.total>=p.spec.dc;if(p.passed)applyOutcome();
}
function acceptCheck(){const p=S.run.pending;if(p&&!p.final)applyOutcome()}

/* ---- short rest ---- */
function shortRest(){
  const r=S.run,h=S.hero;if(!r||r.rested||r.combat)return;
  r.restsUsed=(r.restsUsed||0)+1;r.rested=r.restsUsed>=(qdef().rests||1);r.resting=true;const got=[];
  if(h.cls==='fighter'){if(h.pools.secondwind<maxPools(h).secondwind){h.pools.secondwind++;got.push('a Second Wind')}if(h.level>=2&&!h.pools.surge){h.pools.surge=1;got.push('Action Surge')}}
  if(((h.cls==='cleric'&&h.level>=2)||(h.cls==='paladin'&&h.level>=3))&&h.pools.cd<2){h.pools.cd++;got.push('a Channel Divinity')}
  if(h.cls==='barbarian'&&h.pools.rage<maxPools(h).rage){h.pools.rage++;got.push('a Rage')}
  if(h.cls==='druid'&&h.level>=2&&h.pools.ws<maxPools(h).ws){h.pools.ws++;got.push('a Wild Shape')}
  if(h.cls==='bard'&&h.level>=5&&h.pools.bi<maxPools(h).bi){h.pools.bi=maxPools(h).bi;got.push('all your Bardic Inspiration')}
  if(h.cls==='warlock'&&h.pools.pact<PACT[h.level][0]){h.pools.pact=PACT[h.level][0];got.push('all your pact slots')}
  if(h.cls==='monk'&&h.level>=2&&h.pools.focus<h.level){h.pools.focus=h.level;got.push('all your Focus Points')}
  if(h.cls==='sorcerer'&&h.pools.restore&&h.pools.sp<h.level){h.pools.restore=0;h.pools.sp=Math.min(h.level,h.pools.sp+Math.floor(h.level/2));got.push('Sorcery Points (Sorcerous Restoration)')}
  if(h.species==='orc'&&h.pools.rush<pb()){h.pools.rush=pb();got.push('Adrenaline Rush')}
  if(h.cls==='wizard'&&h.pools.arcane){
    let budget=Math.ceil(h.level/2);const mp=maxPools(h);const rec=[];
    for(let l=5;l>=1;l--){while(budget>=l&&(h.pools['slot'+l]||0)<(mp['slot'+l]||0)){h.pools['slot'+l]++;budget-=l;rec.push(l)}}
    if(rec.length){h.pools.arcane=0;got.push(`level ${rec.join(' and ')} slot${rec.length>1?'s':''} (Arcane Recovery)`)}
  }
  r.restNote=got.length?`You recover ${got.join(', ')}.`:'';
}
function spendHitDie(){
  const r=S.run,h=S.hero;if(!r||!r.resting||!h.pools.hd||h.hp>=h.hpMax)return;
  h.pools.hd--;const x=d(CLASSES[h.cls].hd),n=Math.max(1,x+am('con'))*(activeItems().some(m=>m.name==='Periapt of Wound Closure')?2:1);h.hp=Math.min(h.hpMax,h.hp+n);
  r.restNote=`Hit Die: d${CLASSES[h.cls].hd} [${x}] ${sgn(am('con'))} = ${n} HP.`;
}

/* ---- quest end, levels ---- */
function finishRun(success,reason){

    if(rw.moonseed){S.inv.moonseed+=rw.moonseed;lines.push(`+${rw.moonseed} moonblossom seeds`)}
    if(rw.moonsilver){S.res.moonsilver+=rw.moonsilver;lines.push(`+${rw.moonsilver} moonsilver`)}
    if(r.qid==='raid'){S.raid=null;S.lastRaid=S.day;S.prosperity+=1;lines.push('+1 Prosperity');gainHearts(pick(['maren','bram','ilsa','dorrin']),1)}

    {const lootId=rollLoot(h.level,q.loot!==undefined?q.loot:r.qid==='patrol'?.04:QUESTS[r.qid]&&QUESTS[r.qid].act>=2?.5:.25);if(lootId){giveItem(lootId);lines.push(`Found: ${MAGIC[lootId].name}!`);addLog(`You found ${MAGIC[lootId].name}.`,'good')}}
    if(r.qid!=='patrol'&&r.qid!=='bounty'&&r.qid!=='raid'){S.quests[r.qid]=true;S.prosperity+=1;lines.push('+1 Prosperity')}
    if(r.qid==='descent')S.flags.endModal=true;

    if(r.qid==='s1c')r.result.text=S.flags.rimeShard?'You carry the rime shard down the mountain. It is cold against your skin, and the town’s dogs won’t come near you.':'The Glacier Shrine is sealed again. The herders of the White Pass light fires in your honor all the way down the mountain.';
    if(r.qid==='s2c')r.result.text='The third seal holds. Three of seven.';

  }else if(reason==='fled'){

  }else if(reason==='dead'&&S.flags.permadeath){

    addLog(`${h.name} died during ${q.name}.`,'bad');
  }else{
    const near=reason==='dead',lost=built('chapel')?0:Math.floor(S.res.gold*(near?.25:.1));S.res.gold-=lost;h.hp=1;h.dying=null;S.flags.bruised=near?2:1;
    r.result={success:false,text:near?'You were as good as dead. Ilsa and Bram found you on the road, cold and barely breathing, and it took all of Ilsa’s skill to bring you back.':'You stabilize, alone and bleeding, until villagers find you and carry you home to Ilsa’s cottage.',
      lines:[lost?`Lost ${lost} gp`:'No coin lost',near?'No morning chore for the next 2 days':'No morning chore tomorrow']};
    addLog(`Defeated during ${q.name}.`,'bad');
  }
  if(!success&&r.qid==='raid'&&S.raid){const l=[];raidDamage(Math.max(1,S.raid.strength-defense()),l);S.raid=null;S.lastRaid=S.day;l.forEach(x=>{r.result.lines.push(x);addLog(x,'bad')})}

function checkLevel(){
  const h=S.hero;
  while(h.level<maxLevel()&&h.xp>=XP_AT[h.level]){
    const oldMax=h.hpMax,oldPools=maxPools(h);h.level++;levelFeatures(h,h.level);
    h.hpMax=maxHP(h);h.hp+=h.hpMax-oldMax;const np=maxPools(h);
    for(const k in np)h.pools[k]=(h.pools[k]||0)+Math.max(0,np[k]-(oldPools[k]||0));
    const feats=CLASSES[h.cls].features.filter(f=>f[0]===h.level).map(f=>f[1]);
    if(isCaster(h)){const lv=SLOTS[h.level].length;if(lv>SLOTS[h.level-1].length)feats.push(`level ${lv} spell slots`)}
    addLog(`You reached level ${h.level}.`,'good');
    note(`Level ${h.level}! Max HP is now ${h.hpMax}.${feats.length?` New: ${feats.join(', ')}.`:''}${h.level===5?' Your proficiency bonus rises to +3.':''}`);
  }
}

/* ---- combat on the grid ---- */
const GW=10,GH=12;
const ck=(x,y)=>x+','+y;
const cheb=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
const ft=n=>n*5;
function clog(text,kind){const c=S.run.combat;c.log.push({text,kind:kind||''});if(c.log.length>80)c.log.splice(0,c.log.length-80)}
const fn=f=>f.key==='jarl'?'Jarl Hrimgar':f.key==='morvath'?'Morvath':f.key==='warden'?'the Rot-Warden':f.key==='captain'?'Captain Harl':f.key==='ysolde'?'Ysolde':f.key==='dream'?'the Dream of the Sleeper':f.key==='heart'?'the Heart of the Sleeper':'the '+f.name.toLowerCase();
const Fn=f=>{const t=fn(f);return t[0].toUpperCase()+t.slice(1)};
function liveFoes(){return S.run.combat.foes.filter(f=>f.hp>0)}
function curTarget(){const c=S.run.combat;const t=c.foes[c.target];return t&&t.hp>0?t:liveFoes()[0]}
const isRock=(c,x,y)=>c.rocks.includes(ck(x,y));
const inBounds=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const foeAt=(c,x,y)=>c.foes.find(f=>f.hp>0&&f.x===x&&f.y===y);
function los(c,a,b){
  const ax=a.x+.5,ay=a.y+.5,bx=b.x+.5,by=b.y+.5,n=Math.ceil(Math.max(Math.abs(bx-ax),Math.abs(by-ay))*4);
  for(let i=1;i<n;i++){const x=Math.floor(ax+(bx-ax)*i/n),y=Math.floor(ay+(by-ay)*i/n);
    if((x!==a.x||y!==a.y)&&(x!==b.x||y!==b.y)&&isRock(c,x,y))return false}
  return true;
}
/* blocked(x,y) returns 'no' (can't enter), 'pass' (can cross, can't stop) or false */
function reach(c,from,budget,blocked){
  const out=new Map([[ck(from.x,from.y),{d:0,prev:null,x:from.x,y:from.y,stop:true}]]),q=[{x:from.x,y:from.y}];
  while(q.length){const p=q.shift(),pd=out.get(ck(p.x,p.y)).d;if(pd>=budget)continue;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){if(!dx&&!dy)continue;
      const x=p.x+dx,y=p.y+dy,k=ck(x,y);if(!inBounds(x,y)||out.has(k)||isRock(c,x,y))continue;
      const b=blocked(x,y);if(b==='no')continue;
      out.set(k,{d:pd+1,prev:ck(p.x,p.y),x,y,stop:b!=='pass'});q.push({x,y})}}
  return out;
}
function pathTo(map,x,y){const path=[];let k=ck(x,y);while(k&&map.get(k).prev){const n=map.get(k);path.unshift({x:n.x,y:n.y});k=n.prev}return path}
function heroReach(){const c=S.run.combat,half=S.hero.species==='halfling';return reach(c,c.hero,c.grappledBy!=null?0:c.move,(x,y)=>foeAt(c,x,y)?(half?'pass':'no'):false)}
const adjFoes=()=>liveFoes().filter(f=>cheb(f,S.run.combat.hero)<=1&&!f.turned);
function makeBoard(n){
  for(let tries=0;tries<60;tries++){
    const rocks=[],used=new Set(),hero={x:Math.floor(GW/2)-2+d(2),y:GH-1};used.add(ck(hero.x,hero.y));
    const nr=7+d(6);
    while(rocks.length<nr){const x=d(GW)-1,y=1+d(GH-3),k=ck(x,y);if(!used.has(k)){rocks.push(k);used.add(k)}}
    const spots=[];
    while(spots.length<n){const x=d(GW)-1,y=d(3)-1,k=ck(x,y);if(!used.has(k)){spots.push({x,y});used.add(k)}}
    const r=reach({rocks},hero,99,()=>false);
    if(spots.every(s=>[...r.values()].some(v=>cheb(v,s)<=1)))return{rocks,hero,spots};
  }

const empower=()=>S.hero.cls==='wizard'&&S.hero.level>=10?am('int'):0;
function coneCells(dir){

  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const ux=x-h.x,uy=y-h.y,ul=Math.hypot(ux,uy);if(!ul||cheb(h,{x,y})>12)continue;

}

  const hit=liveFoes().filter(f=>cells.has(ck(f.x,f.y)));if(!hit.length)clog('The cone catches nothing.','info');

    clog(`${Fn(f)} ${ABIL_SHORT[sp.save]} save ${s} ${sgn(f.mods[sp.save])} = ${tot}: ${n} damage.`,saved?'':'good');hurt(f,n,sp.type,false)}

function combatAction(k){
  const c=S.run&&S.run.combat;if(!c||c.over||c.turn!=='hero')return;
  const h=S.hero;
  if(h.dying){if(k==='deathsave')deathSave();return}
  if(!k.startsWith('reroll'))c.lastMiss=null;
  if(WEAPONS[k])weaponAttack(k);
  else if(k.startsWith('up:')){const [,id,l]=k.split(':');c.pick=null;if(id==='smite'){c.smiteLvl=+l;c.smiteNext=true;clog(`Divine Smite readied with a level ${l} slot.`,'info')}else castSpell(id,{slot:+l})}
  else if(k==='cancelpick'){c.pick=null}
  else if(k.startsWith('lvl:')){S.flags.castLvl=+k.slice(4)}
  else if(k.startsWith('split')){const sp=c.split;if(!sp)return;
    if(k==='splitcancel'){c.split=null;return}
    if(k==='splitgo'){const tot=Object.values(sp.alloc).reduce((a,b)=>a+b,0);if(tot!==sp.n)return;c.split=null;castSpell(sp.id,{slot:sp.slot,alloc:sp.alloc});checkWin();return}
    const [op,i]=k.slice(5).split(':'),tot=Object.values(sp.alloc).reduce((a,b)=>a+b,0);
    if(op==='+'&&tot<sp.n)sp.alloc[i]=(sp.alloc[i]||0)+1;if(op==='-'&&(sp.alloc[i]||0)>0)sp.alloc[i]--;return}
  else if(SPELLS[k]){if(spellIssue(k))return;
    if(MULTI[k]){const slot=plannedSlot(k)||0,n=multiCount(k,slot),tg=multiTargets(k);
      if(n>1&&tg.length>1){c.split={id:k,slot,n,alloc:{[c.foes.indexOf(curTarget())]:n}};return}}
    castSpell(k,{slot:castLvl()})}
  else if(k==='spiritual')spiritualStrike(false);
  else if(k==='reroll')rerollAttack('insp');
  else if(k==='rerollluck')rerollAttack('luck');
  else if(k==='cancelaim')c.aim=null;
  else if(k==='dash'){if(c.actions<1)return;c.actions--;c.move+=heroSpeed();clog(`Dash: +${ft(heroSpeed())} ft.`,'info')}
  else if(k==='disengage'){if(c.actions<1)return;c.actions--;c.disengaged=true;clog('Disengage: no opportunity attacks against you this turn.','info')}
  else if(k==='dodge'){if(c.actions<1)return;c.actions--;c.dodging=true;clog('Dodge: attacks against you have disadvantage until your next turn.','info')}
  else if(k==='greater'){if(!c.bonus||S.inv.greater<1)return;S.inv.greater--;c.bonus=false;const r=roll('4d4+4');h.hp=Math.min(h.hpMax,h.hp+r.total);clog(`You drink a greater healing potion: +${r.total} HP (${rtxt(r)}).`,'good')}
  else if(k==='wandmm'){const it=(h.items||[]).find(i=>i.id==='wandmm');const t=curTarget();if(!it||!it.charges||c.actions<1||!t||rangeIssue('ranged',24,24))return;
    it.charges--;c.actions--;const rs=[roll('1d4+1'),roll('1d4+1'),roll('1d4+1')],tot=rs.reduce((a,r)=>a+r.total,0);clog(`Wand of Magic Missiles: three darts hit ${fn(t)} for ${tot} force (${it.charges} charges left).`,'good');hurt(t,tot,'force',false)}
  else if(k==='superior'){if(!c.bonus||!S.inv.superior)return;S.inv.superior--;c.bonus=false;const r=roll('8d4+8');h.hp=Math.min(h.hpMax,h.hp+r.total);clog(`Potion of Superior Healing: +${r.total} HP (${rtxt(r)}).`,'good')}
  else if(k==='heroism'){if(!c.bonus||!S.inv.heroism||h.conds.heroism)return;S.inv.heroism--;c.bonus=false;h.conds.heroism=true;h.temp=Math.max(h.temp,10);clog('Potion of Heroism: 10 temporary HP and +1d4 to attacks and saves.','good')}
  else if(k==='potion'){if(!c.bonus||S.inv.potion<1)return;S.inv.potion--;c.bonus=false;const r=roll('2d4+2');h.hp=Math.min(h.hpMax,h.hp+r.total);clog(`You drink a healing potion: +${r.total} HP (${rtxt(r)}).`,'good')}
  else if(k==='breakfree'){if(c.actions<1||c.grappledBy==null)return;c.actions--;const g=c.foes[c.grappledBy],sk=skillMod('athletics')>=skillMod('acrobatics')?'athletics':'acrobatics',r=rollCheck({skill:sk});
    if(r.total>=(g.grapple||12)){c.grappledBy=null;clog(`You break free. ${checkText(r,g.grapple||12)}.`,'good')}else clog(`You can’t break free. ${checkText(r,g.grapple||12)}.`,'bad')}
  else if(k==='escape'){if(c.actions<1||!onEdge())return;c.over='fled';clog('You slip off the edge of the fight and run.','info');return}
  else if(k==='end'){endTurn();return}
  else feature(k);
  checkWin();
}
const onEdge=()=>{const p=S.run.combat.hero;return p.x===0||p.y===0||p.x===GW-1||p.y===GH-1};
function checkWin(){
  const c=S.run.combat;if(c.over||liveFoes().length)return;
  const xp=c.foes.reduce((a,f)=>a+f.xp,0);S.hero.xp+=xp;c.over='win';clog(`Victory. +${xp} XP.`,'good');
  if(S.hero.conc){clog(`${SPELLS[S.hero.conc].name} ends with the fight.`,'info');S.hero.conc=null}
  checkLevel();
}

/* ---- the hero getting hurt ---- */
function dealHero(n,type){
  const h=S.hero,c=S.run.combat;
  if(type==='poison'&&h.species==='dwarf'){n=Math.floor(n/2);clog('Dwarven Resilience halves the poison damage.','info')}
  if(c&&c.rage&&['bludgeoning','piercing','slashing'].includes(type)){n=Math.floor(n/2);clog('Your rage shrugs off half the damage.','info')}
  if(type==='fire'&&h.cls==='sorcerer'&&h.level>=6){n=Math.floor(n/2);clog('Your draconic blood resists the fire.','info')}
  if(type==='necrotic'&&h.cls==='warlock'&&h.level>=10){n=Math.floor(n/2);clog('Fiendish Resilience halves the necrotic damage.','info')}
  if(type==='necrotic'&&h.gear.necro){n=Math.floor(n/2);clog('Your moonsilver armor halves the necrotic damage.','info')}
  if(h.temp){const a=Math.min(h.temp,n);h.temp-=a;n-=a;if(a)clog(`Temporary HP absorbs ${a}.`,'info')}
  if(n<=0)return;
  h.hp-=n;
  if(h.hp<=0){
    const over=-h.hp;
    if(h.conds.deathward){delete h.conds.deathward;h.hp=1;clog('Death Ward flares: you drop to 1 HP instead.','good');return}
    if(h.pools.relentless&&over<h.hpMax){h.pools.relentless--;h.hp=1;clog('Relentless Endurance: you drop to 1 HP instead.','good');return}
    h.hp=0;
    if(h.conc){clog(`You lose concentration on ${SPELLS[h.conc].name}.`,'bad');h.conc=null}
    if(over>=h.hpMax){clog(`Massive damage: ${over} past 0 HP is at least your HP maximum. You die instantly.`,'bad');c.over='dead';return}
    if(h.cls==='barbarian'&&h.level>=11&&c.rage){const dc=10+5*(h.relentlessUses||0);h.relentlessUses=(h.relentlessUses||0)+1;const sv=heroSave('con',dc);if(sv.pass){h.hp=2*h.level;clog(`Relentless Rage: ${sv.txt}. You refuse to fall, back up at ${h.hp} HP.`,'good');return}}
    h.dying={s:0,f:0};c.heroProne=true;clog('You drop to 0 HP and fall unconscious. You’ll make death saving throws on your turns.','bad');
    return;
  }
  if(h.conc&&!(h.conc==='huntersmark'&&h.cls==='ranger'&&h.level>=13)){const dc=Math.min(30,Math.max(10,Math.floor(n/2))),sv=heroSave('con',dc);
    if(!sv.pass){clog(`Concentration broken (${sv.txt}). ${SPELLS[h.conc].name} ends.`,'bad');h.conc=null}else clog(`You keep concentrating (${sv.txt}).`,'info')}
}
function deathSave(){
  const c=S.run.combat,h=S.hero;if(!h.dying)return;
  if(activeItems().some(m=>m.name==='Periapt of Wound Closure')){clog('Your Periapt of Wound Closure flares: you stabilize.','good');c.over='lose';return}
  const r=heroD20(false,false);
  if(r.nat===20){h.dying=null;h.hp=1;clog(`Death save: ${r.txt}. A natural 20! You regain 1 HP and can act.`,'good');
    Object.assign(c,{actions:1,bonus:true,move:Math.max(0,heroSpeed()-Math.floor(heroSpeed()/2))});c.heroProne=false;clog('You struggle to your feet.','info');return}
  if(r.nat===1)h.dying.f+=2;else if(r.nat>=10)h.dying.s++;else h.dying.f++;
  clog(`Death save: ${r.txt}. ${r.nat>=10?'Success':'Failure'}${r.nat===1?' (counts twice)':''}. ${h.dying.s} of 3 successes, ${Math.min(3,h.dying.f)} of 3 failures.`,r.nat>=10?'good':'bad');

  if(h.dying.f>=3){clog('Your heart stops.','bad');c.over='dead';return}

}

    if(cheb(f,c.hero)>(f.reach||1)){const s2=d(20),tt=s2+f.mods.str;if(tt>=spellDC()){f.restrained=false;clog(`${Fn(f)} tears free of the vines.`,'info')}else clog(`${Fn(f)} struggles against the vines and stays stuck.`,'info');f.acted=true;endFoeTurn(f);return}}

  let speed=f.speed;if(f.slowed)speed=Math.max(0,speed-2);if(inGuardians(f))speed=Math.floor(speed/2);
  if(f.prone){f.prone=false;speed=Math.max(0,speed-Math.floor(f.speed/2));clog(`${Fn(f)} gets up.`,'info')}
  if(f.turned){
    const map=reach(c,f,speed,(x,y)=>(x===c.hero.x&&y===c.hero.y)||c.foes.some(o=>o!==f&&o.hp>0&&o.x===x&&o.y===y)?'no':false);
    let best=null;for(const v of map.values()){const dv=cheb(v,c.hero);if(!best||dv>best.dv)best={...v,dv}}

    f.acted=true;endFoeTurn(f);return;
  }
  if(f.burst&&f.burstReady===false&&d(6)>=5){f.burstReady=true;clog(`${Fn(f)} gathers power again.`,'info')}

    f.burstReady=false;const r=roll(f.burst.dmg),bt=f.burst.dtype||'fire';clog(`${Fn(f)} casts ${f.burst.name}: ${rtxt(r)} = ${r.total} ${bt}.`,'bad');

  }

  else{
    const blk=(x,y)=>(x===c.hero.x&&y===c.hero.y)||c.foes.some(o=>o!==f&&o.hp>0&&o.x===x&&o.y===y)?'no':false;
    const pickBest=m=>{let b=null;for(const v of m.values()){const dv=cheb(v,c.hero);if(!b||dv<b.dv||(dv===b.dv&&v.d<b.d))b={...v,dv}}return b};

      if(b2&&(b2.x!==f.x||b2.y!==f.y))moveFoe(f,map2,b2,true);
      f.acted=true;endFoeTurn(f);return;
    }
    if(best&&(best.x!==f.x||best.y!==f.y))moveFoe(f,map,best);
    if(f.hp>0&&!c.over){dist=cheb(f,c.hero);
      if(dist<=(f.reach||1))foeMelee(f);else if(f.ranged&&dist<=f.ranged.long&&los(c,f,c.hero))foeRanged(f)}

function moveFoe(f,map,dest,dash){

        if(f.hp<=0)return}
    }
    f.x=st.x;f.y=st.y;steps++;

  if(steps)clog(dash?`${Fn(f)} takes the Dash action and runs ${ft(steps)} ft. No attack this turn.`:`${Fn(f)} moves ${ft(steps)} ft (speed ${ft(f.speed)} ft).`,'info');

function dmgRoll(expr,crit,extra){
  const r=roll(expr);let total=r.total,txt=rtxt(r);

function blightClock(n){
  const cx=26,cy=26,r=22,segs=[];
  for(let i=0;i<8;i++){
    const a0=(i/8)*2*Math.PI-Math.PI/2+0.06,a1=((i+1)/8)*2*Math.PI-Math.PI/2-0.06;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    segs.push(`<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${i<n?'var(--blight)':'var(--sunk)'}"/>`);
  }
  return `<svg width="52" height="52" viewBox="0 0 52 52" role="img" aria-label="Blight Clock: ${n} of 8">${segs.join('')}<circle cx="26" cy="26" r="7" fill="var(--bg)"/></svg>`;
}

function playFX(){

  const list=FX;FX=[];DIED.clear();
  const fire=()=>{for(const e of list){
    const cell=board.querySelector(`[data-tok="${e.id}"]`);if(!cell)continue;const tok=cell.querySelector('.tok');
    if(tok&&(e.kind==='hit'||e.kind==='heal')){const k='fx-'+e.kind;tok.classList.remove(k);void tok.offsetWidth;tok.classList.add(k)}
    const pop=document.createElement('span');pop.className='pop '+e.kind;
    pop.textContent=e.kind==='hit'?`−${e.n}`:e.kind==='heal'?`+${e.n}`:e.kind==='block'?'Shield!':'Miss';
    cell.appendChild(pop);setTimeout(()=>pop.remove(),1200);
  }};
  moveMs?setTimeout(fire,moveMs):fire();
}

        html+=`<p class="meta">${n} worker${n===1?'':'s'} here. Assign more in the Workers list below.</p><div class="actions">${btn('chore',CHORES[ch].label+' (morning)',`data-k="${ch}" ${dis(S.used.morning)}`,'btn ghost')}</div>`}

      if(k==='chapel'&&lvl('chapel')>=3)html+=`<div class="row" style="margin-top:8px"><span>Superior healing potion: heals 8d4 + 8. ${weeklyStock().superior?'One available this week.':'Out until Monday.'}</span>${weeklyStock().superior?btn('buysup','150 gp',dis(S.res.gold<150),'btn small'):'<span class="tag">Sold out</span>'}</div>`;
      if(k==='chapel')html+=`<div class="row" style="margin-top:8px"><span>Greater healing potion: heals 4d4 + 4. You have ${S.inv.greater}. ${weeklyStock().chapel?`The sisters can spare ${weeklyStock().chapel} more this week.`:'The sisters are out until Monday.'}</span>${weeklyStock().chapel?btn('buygreater','50 gp',dis(S.res.gold<50),'btn small'):'<span class="tag">Sold out</span>'}</div>`;
      if(k==='market')html+=`<p class="meta">Traders pay ${lvl('market')>=3?25:15} gp for each lump of moonsilver. You have ${S.res.moonsilver}.</p><div class="actions">${btn('sellms','Sell 1 moonsilver',dis(!S.res.moonsilver),'btn ghost small')}${btn('tab','Visit Corwin’s stall','data-t="folk"','btn ghost small')}</div>`;
    }

    const left=p.res==='timber'?S.salvage.timber:S.salvage.stone,ck=p.res==='timber'?'salvageTimber':'salvageStone';
    html+=`<span class="tag">${left} ${p.res} left</span></div><p>${p.res==='timber'?'Sagging roofs and doors you can strip for timber.':'Fallen walls of dressed stone you can haul away.'}</p>
    <div class="actions">${btn('chore',`${CHORES[ck].label} (morning)`,`data-k="${ck}" ${dis(S.used.morning||!left)}`,'btn ghost')}</div>`;
  }else if(p.kind==='fields'){
    const growing=S.plots.filter(x=>x.crop).length,ready=S.plots.filter(x=>x.crop&&x.days>=CROPS[x.crop].grow).length;

  }else if(p.kind==='mine'){
    const miners=S.workers.filter(w=>w.assign==='mine').length;
    html+=`<span class="tag ${S.quests.seal?'':'lock'}">${S.flags.act2?'Second seal broken':S.quests.seal?'Seal broken':'Sealed'}</span></div><p>${S.flags.act2?'Something vast stirs far below. The deep galleries are quiet, for now.':S.quests.seal?'The cracked door stands open. The old Varne workings go down into the hill.':'Boarded and sealed long ago. Whatever is behind it is leaking grey rot into the valley.'}</p>
    ${S.flags.warren?`<p class="meta">${miners} worker${miners===1?'':'s'} mining moonsilver. You have ${S.res.moonsilver}.</p>`:''}

    html+=`<span class="tag lock">Hamlet tier</span></div><p class="meta">An empty lot, waiting. This becomes available once Hollowmere grows into a hamlet.</p>`;
  }
  return html+'</div>';
}
function renderTown(){

  const rk=townRank(),dp=defenseParts();
  const raidBox=S.raid?`<div class="raidbox"><p><b>${S.raid.arrive>S.day?'Raid tomorrow':'Raid today'}: ${RAIDS[S.raid.type].name}.</b> ${RAIDS[S.raid.type].text}</p>
    <p class="meta">Raid strength ${S.raid.strength} against your defense of ${defense()}. ${S.raid.arrive>S.day?'Use today to prepare: assign guards or finish defenses.':`If you defend, you’ll fight ${raidFights()} group${raidFights()>1?'s':''}. If you don’t, ${S.raid.strength-defense()<=0?'your defenses should hold on their own.':'the town takes damage tonight.'}`}</p>
    ${S.raid.arrive<=S.day?`<div class="actions">${btn('quest','Defend the town','data-q="raid" '+dis(S.used.day),'btn')}</div>`:''}</div>`:'';
  return `${raidBox}<h2>Hollowmere, ${rk.name.toLowerCase()}</h2>${rk.next?`<p class="meta">Next rank, ${rk.next}</p>`:'<p class="meta">Hollowmere is the seat of the whole valley: 5 bounties a week, 2 more housing, and 25 gp a week in tithes from the outlying farms.</p>'}

    return btn('chore',`${CHORES[k].label}${left!==null?` (${left} left)`:''}`,`data-k="${k}" ${dis(S.used.morning||left===0)}`,'btn ghost');

function jobHint(w){
  const kb=w.kind==='kobold'?1:0;
  return{build:'Adds 1 build point to the current project every night.',idle:'Resting. Still paid.',
    salvage:`Each week: 1d${w.die}${kb?' + 1':''} timber or stone from the ruins, whichever you have less of.`,
    lumber:`Each week: 1d${w.die} + ${(lvl('lumber')>=2?2:0)+(lvl('lumber')>=3?3:0)} timber.`.replace(' + 0',''),
    quarry:`Each week: 1d${w.die} + ${kb+(lvl('quarry')>=2?2:0)+(lvl('quarry')>=3?3:0)} stone.`.replace(' + 0',''),
    mine:'Each week: a chance at a lump of moonsilver.',guard:'+1 town defense against raids.'}[w.assign]||'';
}

  const opts=[['build','Construction'],['idle','Resting']].concat(S.salvage.timber+S.salvage.stone>0?[['salvage','Scavenge the ruins']]:[],built('lumber')?[['lumber','Lumber camp']]:[],built('quarry')?[['quarry','Quarry']]:[],S.flags.warren&&S.flags.ending!=='reseal'?[['mine','Mine (moonsilver)']]:[],S.flags.act1?[['guard','Guard (+1 defense)']]:[]);

    <div class="actions"><label class="meta">Job <select data-assign="${w.id}">${opts.map(([v,l])=>`<option value="${v}" ${w.assign===v?'selected':''}>${l}</option>`).join('')}</select></label>${btn('fire','Let go',`data-id="${w.id}"`,'btn ghost small')}</div></li>`).join('')}</ul>`;
  html+=`<p class="meta">${built('lumber')&&built('quarry')?'':'The Lumber camp and Quarry jobs appear once those buildings are finished. '}Kobold diggers get +1 when quarrying, scavenging or mining.</p>`;

let seedPlot=null;
const cropSell=k=>CROPS[k].sell+(built('market')?1:0)+(lvl('farmstead')>=3?1:0);
const CROP_USES={
  potato:'Cheap and quick: the easy way to earn a little gold. Dorrin and Corwin love them as gifts.',
  wheat:'Mill one into 2 food to feed your workers, or sell it. Bram loves it as a gift.',
  moon:'Ilsa brews it into a healing potion for 5 gp, or it sells for the best price. Maren and Ilsa love it as a gift.'
};
function seedGuide(i){
  const water=lvl('well')>=3?'The aqueduct waters it for you':'It grows only on days it’s watered (or rains)';
  const fast=S.flags.ending==='bloom';
  const rows=['potato','wheat','moon'].map(k=>{
    const c=CROPS[k],cost=k==='moon'?0:c.seed,days=fast?Math.ceil(c.grow/2):c.grow,sell=cropSell(k),have=k!=='moon'||S.inv.moonseed>0;
    const per=((sell-cost)/days).toFixed(1);
    return `<li><div class="row"><h3>${c.name}</h3><span class="meta">${k==='moon'?`${S.inv.moonseed} seed${S.inv.moonseed===1?'':'s'} in hand`:`${cost} gp a seed`}</span></div>
      <p>Ready after ${days} watered day${days>1?'s':''}${fast?' (the grey bloom doubles growth)':''}. Sells for ${sell} gp${k==='moon'?'':`, a profit of ${sell-cost} gp`}, about ${per} gp a day.</p>
      <p class="meta">${CROP_USES[k]}${k==='moon'?' Seeds come from quests, Ilsa’s friendship and Corwin’s cart.':''}</p>
      <div class="actions">${btn('plant',`Plant ${c.name.toLowerCase()}${cost?` for ${cost} gp`:''}`,`data-i="${i}" data-c="${k}" ${dis(!have||S.res.gold<cost)}`,'btn small')}</div></li>`}).join('');
  return `<div class="pickrow"><p><b>What to plant in field ${i+1}?</b> ${water}.</p><ul class="ledger">${rows}</ul><div class="actions">${btn('seedcancel','Cancel','','btn ghost small')}</div></div>`;
}
function renderFarm(){
  const anyCrop=S.plots.some(p=>p.crop);
  const inv=['potato','wheat','moon'].filter(k=>S.inv[k]>0);
  const binTotal=Object.entries(S.bin).reduce((a,[k,v])=>a+v*cropSell(k),0);
  return `<h2>Fields</h2>
  <p class="meta">Crops only grow on days they’re watered, or when it rains.${built('farmstead')?'':' Rebuild the farmstead to open 3 more plots.'}</p>
  <div class="actions">${btn('water',S.used.water?'Watered today':'Water all crops',dis(S.used.water||!anyCrop||S.weather==='rain'))}</div>
  <div class="plots" style="margin-top:14px">${S.plots.map((p,i)=>{
    if(!p.crop)return `<div class="plot ${seedPlot===i?'ready':''}"><span class="meta">Field ${i+1}: empty</span><div class="actions">${btn('seedpick',seedPlot===i?'Choosing…':'Plant something',`data-i="${i}"`,seedPlot===i?'btn small':'btn ghost small')}</div></div>`;
    const c=CROPS[p.crop],ready=p.days>=c.grow;
    return `<div class="plot ${ready?'ready':'growing'}"><h3>${c.name}</h3>
      ${ready?'<span>Ready to harvest</span>':`<div class="bar"><i style="width:${pct(p.days,c.grow)}%"></i></div><span class="meta">Day ${p.days} of ${c.grow}. ${p.watered||S.weather==='rain'?'Watered.':'Thirsty.'}</span>`}
      ${ready?`<div class="actions">${btn('harvest','Harvest',`data-i="${i}"`,'btn small')}</div>`:''}</div>`;
  }).join('')}</div>
  ${seedPlot!=null&&S.plots[seedPlot]&&!S.plots[seedPlot].crop?seedGuide(seedPlot):''}
  <h2>Produce</h2>
  ${inv.length?`<ul class="ledger">${inv.map(k=>`<li><div class="row"><h3>${CROPS[k].name}: ${S.inv[k]}</h3><span class="meta">Sells for ${cropSell(k)} gp each</span></div><div class="actions">
    ${btn('ship','Put all in the shipping bin',`data-k="${k}"`,'btn small')}
    ${k==='wheat'?btn('mill','Mill one into 2 food','','btn ghost small'):''}
    ${k==='moon'?btn('brew',`Ilsa brews a potion (5 gp)`,dis(S.res.gold<5),'btn ghost small'):''}</div></li>`).join('')}</ul>`:'<p class="meta">Nothing harvested yet.</p>'}

/* ---- avatar tokens ---- */
function avatarHTML(src,name,cls,extra){
  return src?`<span class="${cls} img" style="background-image:url('${src}')" role="img" aria-label="${esc(name)}">${extra||''}</span>`
            :`<span class="${cls}" aria-hidden="true">${esc((name||'Y')[0].toUpperCase())}${extra||''}</span>`;
}
function loadAvatar(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    const size=160,cv=document.createElement('canvas');cv.width=cv.height=size;
    const g=cv.getContext('2d'),side=Math.min(img.naturalWidth,img.naturalHeight);
    g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,size,size);
    const data=cv.toDataURL('image/jpeg',0.85);URL.revokeObjectURL(url);
    if(draft&&(!S||S.flags.rebuild||S.flags.fallen))draft.avatar=data;else if(S){S.hero.avatar=data;addLog('You chose a new token for your hero.')}
    S&&!draft?commit():render();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);alert('That image couldn’t be read. Try a JPEG or PNG.')};
  img.src=url;
}
